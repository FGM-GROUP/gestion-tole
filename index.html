<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TÔLERIE — Gestion de stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14171a;
    --panel:#1c2024;
    --panel-2:#22262b;
    --line:#333a41;
    --ink:#e9e7e2;
    --ink-dim:#9aa2a9;
    --accent:#f2b705;
    --accent-ink:#14171a;
    --blue:#5b93b3;
    --danger:#c1443c;
    --danger-bg:#2a1c1b;
    --ok:#5fa06a;
    --radius:3px;
    --display:'Oswald',sans-serif;
    --body:'IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);}
  body{display:flex;min-height:100vh;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* Ruler signature strip */
  #ruler{
    width:18px;flex:0 0 18px;height:100vh;position:sticky;top:0;
    background:
      repeating-linear-gradient(to bottom,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 10px),
      repeating-linear-gradient(to bottom,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 50px);
    background-size: 6px 10px, 12px 50px;
    background-position: right, right;
    background-repeat: repeat-y;
    border-right:1px solid var(--line);
    opacity:.75;
  }

  #sidebar{
    width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.5px;line-height:1.15;color:var(--ink);}
  .brand span{color:var(--accent);}
  .brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:1px;margin-top:6px;text-transform:uppercase;}
  nav{margin-top:34px;display:flex;flex-direction:column;gap:4px;}
  .nav-btn{
    font-family:var(--display);font-size:14px;letter-spacing:.5px;text-transform:uppercase;
    text-align:left;background:none;border:none;color:var(--ink-dim);padding:11px 10px;border-radius:var(--radius);
    cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;
  }
  .nav-btn .num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .nav-btn:hover{color:var(--ink);background:var(--panel-2);}
  .nav-btn.active{color:var(--ink);background:var(--panel-2);border-left-color:var(--accent);}
  .nav-btn.active .num{color:var(--accent);}
  .sidebar-foot{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--ink-dim);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;}

  main{flex:1;padding:36px 44px;max-width:1180px;}
  header.page{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;letter-spacing:.3px;}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
  .lede{color:var(--ink-dim);font-size:13.5px;margin-top:6px;max-width:520px;}

  button{font-family:var(--body);cursor:pointer;}
  .btn{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:var(--radius);
    font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{border-color:var(--ink-dim);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
  .btn.danger:hover{background:var(--danger-bg);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim);padding:6px 8px;}
  .btn.ghost:hover{color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  input[type=text],input[type=number],select,textarea{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:var(--radius);
    font-family:var(--body);font-size:13px;
  }
  input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search{min-width:220px;}
  label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    color:var(--ink-dim);border-bottom:1px solid var(--line);padding:0 12px 10px;font-weight:500;
  }
  tbody td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-2);}
  .ref{font-family:var(--mono);font-weight:600;letter-spacing:.3px;}
  .dim{font-family:var(--mono);color:var(--ink-dim);font-size:12.5px;}
  .zone-pill{
    font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px;color:var(--blue);white-space:nowrap;
  }
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:24px;height:24px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .qty-ctrl button:hover{border-color:var(--accent);color:var(--accent);}
  .qty-val{font-family:var(--mono);min-width:24px;text-align:center;font-weight:600;}
  .qty-low .qty-val{color:var(--danger);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:46px 24px;text-align:center;color:var(--ink-dim);
  }
  .empty b{color:var(--ink);display:block;font-family:var(--display);font-size:16px;margin-bottom:6px;font-weight:500;}

  /* Zones grid — hazard tag style */
  .zones-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .tag{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .tag-stripe{
    height:8px;width:100%;
    background:repeating-linear-gradient(-45deg,var(--accent),var(--accent) 8px,#1a1a1a 8px,#1a1a1a 16px);
  }
  .tag-body{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .tag-code{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:1px;}
  .tag-name{color:var(--ink-dim);font-size:13px;margin-top:-6px;}
  .tag-count{font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);}
  .tag-qr{display:flex;justify-content:center;padding:6px;background:#fff;border-radius:2px;width:fit-content;}
  .tag-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}

  /* Scanner viewfinder */
  .scanner-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
  .viewfinder{
    position:relative;width:340px;height:340px;background:#000;border-radius:var(--radius);overflow:hidden;
    flex:0 0 auto;
  }
  .viewfinder video{width:100%;height:100%;object-fit:cover;display:block;}
  .viewfinder .corner{position:absolute;width:28px;height:28px;border:3px solid var(--accent);}
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}
  .viewfinder .idle{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    color:var(--ink-dim);font-size:13px;text-align:center;padding:20px;
  }
  .scan-line{position:absolute;left:14px;right:14px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);top:50%;animation:scanmove 2.2s ease-in-out infinite;}
  @keyframes scanmove{0%{top:16%;}50%{top:84%;}100%{top:16%;}}
  .scan-panel{flex:1;min-width:280px;}
  .result-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .result-card.found{border-color:var(--ok);}
  .result-card.notfound{border-color:var(--danger);}
  .manual-scan{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .manual-scan .row{display:flex;gap:8px;margin-top:8px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:520px;padding:26px 28px;}
  .modal h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;margin-bottom:14px;}
  .field input,.field select,.field textarea{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .banner{
    background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--radius);
    padding:10px 14px;font-size:12.5px;color:var(--ink-dim);margin-bottom:20px;
  }
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--radius);
    font-size:13px;font-weight:500;z-index:100;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:fixed;top:40px;left:40px;}
    .print-tag{border:2px solid #000;padding:20px;width:260px;font-family:var(--mono);}
    .print-tag .pcode{font-size:30px;font-weight:700;margin-bottom:4px;}
    .print-tag .pname{font-size:14px;margin-bottom:12px;color:#333;}
  }

  @media (max-width:820px){
    #ruler{display:none;}
    body{flex-direction:column;}
    #sidebar{width:100%;flex:none;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 16px;}
    nav{margin-top:0;flex-direction:row;margin-left:auto;}
    .sidebar-foot{display:none;}
    main{padding:22px 18px;}
    .grid2,.grid3{grid-template-columns:1fr;}
  }

  a{color:var(--blue);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<div id="ruler" aria-hidden="true"></div>

<div id="sidebar">
  <div class="brand">TÔLE<span>RIE</span></div>
  <div class="brand-sub">Gestion de stock</div>
  <nav>
    <button class="nav-btn active" data-tab="inventaire"><span class="num">01</span> Inventaire</button>
    <button class="nav-btn" data-tab="zones"><span class="num">02</span> Zones</button>
    <button class="nav-btn" data-tab="scanner"><span class="num">03</span> Scanner QR</button>
  </nav>
  <div class="sidebar-foot"><span class="dot"></span>Données partagées entre tous les utilisateurs</div>
</div>

<main>
  <div id="view"></div>
</main>

<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------
   DATA LAYER
--------------------------------------------------------- */
let toles = [];
let zones = [];
let currentTab = 'inventaire';
let scanStream = null;
let scanRAF = null;

/* ---------------------------------------------------------
   🔧 CONFIGURATION — collez ici les valeurs de votre projet Firebase
   (Console Firebase → ⚙️ Paramètres du projet → Vos applications → Config)
--------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyB1CHMeUotZxDQ9FPfOG_QTbU-subK46yg",
  authDomain: "stock-matire-fgm-group.firebaseapp.com",
  projectId: "stock-matire-fgm-group",
  storageBucket: "stock-matire-fgm-group.firebasestorage.app",
  messagingSenderId: "491683601309",
  appId: "1:491683601309:web:75c89f3f556c0dd83c6d74",
  measurementId: "G-NVSE1H1W9W"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let serverIdSnapshots = {};

const uid = () => Math.random().toString(36).slice(2,9);

/* Référence automatique : MATIÈRE-NUANCE-ÉPAISSEURxLONGUEURxLARGEUR-SÉQUENCE */
const MATIERE_CODES = {
  'Acier':'AC', 'Acier galvanisé':'GA', 'Inox':'IX', 'Aluminium':'AL', 'Cuivre':'CU', 'Autre':'XX'
};
function slugPart(str){
  return String(str||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]+/g,'').slice(0,12);
}
function buildRefBase(matiere, nuance, epaisseur, longueur, largeur){
  const parts = [MATIERE_CODES[matiere] || 'XX'];
  const n = slugPart(nuance);
  if(n) parts.push(n);
  const ep = String(epaisseur).replace('.', ',');
  parts.push(`${ep}X${longueur}X${largeur}`);
  return parts.join('-');
}
function generateRef(matiere, nuance, epaisseur, longueur, largeur, excludeId){
  const base = buildRefBase(matiere, nuance, epaisseur, longueur, largeur);
  const nums = toles
    .filter(t => t.id !== excludeId && t.ref && t.ref.startsWith(base + '-'))
    .map(t => { const m = t.ref.match(/-(\d{3,})$/); return m ? parseInt(m[1], 10) : 0; });
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `${base}-${String(next).padStart(3,'0')}`;
}

async function loadData(){
  try{
    const snap = await db.collection('toles').get();
    toles = snap.docs.map(d=>{
      const data = d.data();
      return {
        id: uid(), _fbId: d.id,
        ref: data.ref || '', matiere: data.matiere || 'Acier', nuance: data.nuance || '',
        epaisseur: Number(data.epaisseur) || 0, longueur: Number(data.longueur) || 0, largeur: Number(data.largeur) || 0,
        qte: Number(data.qte) || 0, seuil: Number(data.seuil) || 0, zone: data.zone || ''
      };
    });
    serverIdSnapshots.toles = new Set(toles.map(t=>t._fbId));
  }catch(e){ console.error(e); toles = []; toast('Impossible de charger le stock depuis Firebase'); }

  try{
    const zsnap = await db.collection('zones').get();
    zones = zsnap.docs.map(d=>({ code: d.id, nom: d.data().nom || d.id }));
    serverIdSnapshots.zones = new Set(zones.map(z=>z.code));
  }catch(e){ console.error(e); zones = []; toast('Impossible de charger les zones depuis Firebase'); }
}

async function saveToles(){
  try{
    const currentIds = new Set(toles.filter(t=>t._fbId).map(t=>t._fbId));
    const removed = [...(serverIdSnapshots.toles || new Set())].filter(id=>!currentIds.has(id));
    for(const id of removed){ await db.collection('toles').doc(id).delete(); }
    for(const t of toles){
      const fields = {
        ref: t.ref, matiere: t.matiere, nuance: t.nuance || '',
        epaisseur: t.epaisseur, longueur: t.longueur, largeur: t.largeur,
        qte: t.qte, seuil: t.seuil, zone: t.zone || ''
      };
      if(t._fbId){
        await db.collection('toles').doc(t._fbId).set(fields);
      }else{
        const ref = await db.collection('toles').add(fields);
        t._fbId = ref.id;
      }
    }
    serverIdSnapshots.toles = new Set(toles.filter(t=>t._fbId).map(t=>t._fbId));
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

async function saveZones(){
  try{
    const currentCodes = new Set(zones.map(z=>z.code));
    const removed = [...(serverIdSnapshots.zones || new Set())].filter(c=>!currentCodes.has(c));
    for(const c of removed){ await db.collection('zones').doc(c).delete(); }
    for(const z of zones){ await db.collection('zones').doc(z.code).set({ nom: z.nom }); }
    serverIdSnapshots.zones = new Set(currentCodes);
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 2400);
}

/* ---------------------------------------------------------
   NAV
--------------------------------------------------------- */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    stopScanner();
    currentTab = btn.dataset.tab;
    render();
  });
});

function render(){
  if(currentTab === 'inventaire') renderInventaire();
  else if(currentTab === 'zones') renderZones();
  else if(currentTab === 'scanner') renderScanner();
}

/* ---------------------------------------------------------
   INVENTAIRE
--------------------------------------------------------- */
let invSearch = '';
let invZoneFilter = '';

function renderInventaire(){
  const view = document.getElementById('view');
  const filtered = toles.filter(t=>{
    const matchSearch = !invSearch || (t.ref+t.matiere+(t.nuance||'')).toLowerCase().includes(invSearch.toLowerCase());
    const matchZone = !invZoneFilter || t.zone === invZoneFilter;
    return matchSearch && matchZone;
  });

  view.innerHTML = `
    <header class="page">
      <div>
        <div class="eyebrow">Stock</div>
        <h1>Inventaire des tôles</h1>
        <div class="lede">${toles.length} référence(s) enregistrée(s) sur ${zones.length} zone(s) de rangement.</div>
      </div>
      <button class="btn primary" id="add-tole-btn">+ Ajouter une tôle</button>
    </header>

    <div class="toolbar">
      <input type="text" class="search" id="inv-search" placeholder="Rechercher une référence ou une matière…" value="${escapeHtml(invSearch)}">
      <select id="inv-zone-filter">
        <option value="">Toutes les zones</option>
        ${zones.map(z=>`<option value="${z.code}" ${invZoneFilter===z.code?'selected':''}>${z.code} — ${escapeHtml(z.nom)}</option>`).join('')}
      </select>
    </div>

    ${filtered.length === 0 ? `
      <div class="empty">
        <b>${toles.length===0 ? 'Aucune tôle en stock' : 'Aucun résultat'}</b>
        ${toles.length===0 ? 'Ajoutez votre première référence pour démarrer l\'inventaire.' : 'Essayez une autre recherche ou zone.'}
      </div>
    ` : `
      <table>
        <thead>
          <tr>
            <th>Référence</th><th>Matière</th><th>Nuance</th><th>Dimensions</th><th>Épaisseur</th>
            <th>Zone</th><th>Quantité</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(t=>`
            <tr class="${t.qte<=t.seuil ? 'qty-low':''}">
              <td class="ref">${escapeHtml(t.ref)}</td>
              <td>${escapeHtml(t.matiere)}</td>
              <td class="dim">${t.nuance ? escapeHtml(t.nuance) : '—'}</td>
              <td class="dim">${t.longueur}×${t.largeur} mm</td>
              <td class="dim">${t.epaisseur} mm</td>
              <td>${t.zone ? `<span class="zone-pill">${t.zone}</span>` : '<span class="dim">—</span>'}</td>
              <td>
                <div class="qty-ctrl">
                  <button data-qty="-1" data-id="${t.id}" aria-label="Diminuer">−</button>
                  <span class="qty-val">${t.qte}</span>
                  <button data-qty="1" data-id="${t.id}" aria-label="Augmenter">+</button>
                </div>
              </td>
              <td>
                <div class="row-actions">
                  <button class="btn ghost small" data-edit="${t.id}">Modifier</button>
                  <button class="btn ghost small" data-del="${t.id}">Suppr.</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `}
  `;

  document.getElementById('add-tole-btn').onclick = ()=> openToleModal();
  document.getElementById('inv-search').oninput = (e)=>{ invSearch = e.target.value; renderInventaire(); };
  document.getElementById('inv-zone-filter').onchange = (e)=>{ invZoneFilter = e.target.value; renderInventaire(); };

  view.querySelectorAll('[data-qty]').forEach(b=>{
    b.onclick = async ()=>{
      const t = toles.find(x=>x.id===b.dataset.id);
      t.qte = Math.max(0, t.qte + parseInt(b.dataset.qty));
      await saveToles();
      renderInventaire();
    };
  });
  view.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = ()=> openToleModal(toles.find(x=>x.id===b.dataset.edit));
  });
  view.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      if(confirm('Supprimer cette référence du stock ?')){
        toles = toles.filter(x=>x.id!==b.dataset.del);
        await saveToles();
        renderInventaire();
      }
    };
  });
}

function openToleModal(existing, prefillZone){
  const editing = !!existing;
  const t = existing || { id: uid(), ref:'', matiere:'Acier', nuance:'', epaisseur:1, longueur:1000, largeur:1000, qte:1, seuil:1, zone: prefillZone || '' };
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${editing ? 'Modifier la tôle' : 'Ajouter une tôle'}</h2>
      <div class="field">
        <label>Référence <span style="text-transform:none;letter-spacing:0;color:var(--ink-dim);font-weight:400;">(générée automatiquement — modifiable)</span></label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="f-ref" value="${escapeHtml(t.ref)}" style="flex:1">
          <button type="button" class="btn small" id="regen-ref" title="Régénérer à partir de la nuance, l'épaisseur et les dimensions">↻ Régénérer</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>Matière</label>
          <select id="f-matiere">
            ${['Acier','Acier galvanisé','Inox','Aluminium','Cuivre','Autre'].map(m=>`<option ${t.matiere===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Épaisseur (mm)</label><input type="number" step="0.1" id="f-ep" value="${t.epaisseur}"></div>
      </div>
      <div class="field"><label>Nuance</label><input type="text" id="f-nuance" value="${escapeHtml(t.nuance||'')}" placeholder="Ex. S235JR, DX51D, 5754, 304L…"></div>
      <div class="grid2">
        <div class="field"><label>Longueur (mm)</label><input type="number" id="f-long" value="${t.longueur}"></div>
        <div class="field"><label>Largeur (mm)</label><input type="number" id="f-larg" value="${t.largeur}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Quantité</label><input type="number" id="f-qte" value="${t.qte}"></div>
        <div class="field"><label>Seuil d'alerte</label><input type="number" id="f-seuil" value="${t.seuil}"></div>
      </div>
      <div class="field"><label>Zone de rangement</label>
        <select id="f-zone">
          <option value="">— Non affectée —</option>
          ${zones.map(z=>`<option value="${z.code}" ${t.zone===z.code?'selected':''}>${z.code} — ${escapeHtml(z.nom)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-modal">Annuler</button>
        <button class="btn primary" id="save-tole">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancel-modal').onclick = ()=> overlay.remove();

  const refInput = overlay.querySelector('#f-ref');
  const matiereSel = overlay.querySelector('#f-matiere');
  const nuanceInput = overlay.querySelector('#f-nuance');
  const epInput = overlay.querySelector('#f-ep');
  const longInput = overlay.querySelector('#f-long');
  const largInput = overlay.querySelector('#f-larg');
  let refManuallyEdited = editing && !!t.ref;

  function recomputeRef(){
    if(refManuallyEdited) return;
    refInput.value = generateRef(
      matiereSel.value, nuanceInput.value,
      parseFloat(epInput.value) || 0,
      parseInt(longInput.value) || 0,
      parseInt(largInput.value) || 0,
      editing ? t.id : null
    );
  }
  [matiereSel, nuanceInput, epInput, longInput, largInput].forEach(el=>{
    el.addEventListener('input', recomputeRef);
  });
  refInput.addEventListener('input', ()=>{ refManuallyEdited = true; });
  overlay.querySelector('#regen-ref').addEventListener('click', ()=>{
    refManuallyEdited = false;
    recomputeRef();
  });
  if(!editing) recomputeRef();

  overlay.querySelector('#save-tole').onclick = async ()=>{
    const ref = overlay.querySelector('#f-ref').value.trim();
    if(!ref){ toast('La référence est requise'); return; }
    t.ref = ref;
    t.matiere = overlay.querySelector('#f-matiere').value;
    t.nuance = overlay.querySelector('#f-nuance').value.trim();
    t.epaisseur = parseFloat(overlay.querySelector('#f-ep').value) || 0;
    t.longueur = parseInt(overlay.querySelector('#f-long').value) || 0;
    t.largeur = parseInt(overlay.querySelector('#f-larg').value) || 0;
    t.qte = parseInt(overlay.querySelector('#f-qte').value) || 0;
    t.seuil = parseInt(overlay.querySelector('#f-seuil').value) || 0;
    t.zone = overlay.querySelector('#f-zone').value;
    if(!editing) toles.push(t);
    await saveToles();
    overlay.remove();
    toast(editing ? 'Tôle mise à jour' : 'Tôle ajoutée');
    render();
  };
}

/* ---------------------------------------------------------
   ZONES
--------------------------------------------------------- */
function renderZones(){
  const view = document.getElementById('view');
  view.innerHTML = `
    <header class="page">
      <div>
        <div class="eyebrow">Rangement</div>
        <h1>Zones de stockage</h1>
        <div class="lede">Créez une zone, imprimez son étiquette QR et collez-la sur l'emplacement physique.</div>
      </div>
      <button class="btn primary" id="add-zone-btn">+ Créer une zone</button>
    </header>

    ${zones.length === 0 ? `
      <div class="empty">
        <b>Aucune zone créée</b>
        Ajoutez une zone (ex. "Rack A — Étagère 2") pour générer son étiquette QR à imprimer.
      </div>
    ` : `
      <div class="zones-grid">
        ${zones.map(z=>{
          const count = toles.filter(t=>t.zone===z.code).reduce((s,t)=>s+t.qte,0);
          const refs = toles.filter(t=>t.zone===z.code).length;
          return `
          <div class="tag">
            <div class="tag-stripe"></div>
            <div class="tag-body">
              <div class="tag-code">${escapeHtml(z.code)}</div>
              <div class="tag-name">${escapeHtml(z.nom)}</div>
              <div class="tag-qr" id="qr-${z.code}"></div>
              <div class="tag-count">${refs} référence(s) · ${count} unité(s)</div>
              <div class="tag-actions">
                <button class="btn small" data-view-zone="${z.code}">Voir contenu</button>
                <button class="btn small" data-print-zone="${z.code}">Imprimer</button>
                <button class="btn ghost small" data-del-zone="${z.code}">Suppr.</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `}
  `;

  document.getElementById('add-zone-btn').onclick = openZoneModal;

  zones.forEach(z=>{
    const holder = document.getElementById('qr-'+z.code);
    if(holder && window.QRCode){
      holder.innerHTML = '';
      new QRCode(holder, { text: z.code, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
    }
  });

  view.querySelectorAll('[data-view-zone]').forEach(b=>{
    b.onclick = ()=>{
      invZoneFilter = b.dataset.viewZone;
      invSearch = '';
      currentTab = 'inventaire';
      document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
      document.querySelector('[data-tab="inventaire"]').classList.add('active');
      renderInventaire();
    };
  });
  view.querySelectorAll('[data-print-zone]').forEach(b=>{
    b.onclick = ()=> printZoneTag(zones.find(z=>z.code===b.dataset.printZone));
  });
  view.querySelectorAll('[data-del-zone]').forEach(b=>{
    b.onclick = async ()=>{
      const used = toles.some(t=>t.zone===b.dataset.delZone);
      if(used && !confirm('Des tôles sont affectées à cette zone. La supprimer quand même ?')) return;
      zones = zones.filter(z=>z.code!==b.dataset.delZone);
      await saveZones();
      renderZones();
    };
  });
}

function openZoneModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Créer une zone de rangement</h2>
      <div class="field"><label>Code zone</label><input type="text" id="z-code" placeholder="Ex. A1"></div>
      <div class="field"><label>Nom / description</label><input type="text" id="z-nom" placeholder="Ex. Rack A — Étagère 1"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-z">Annuler</button>
        <button class="btn primary" id="save-z">Créer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancel-z').onclick = ()=> overlay.remove();
  overlay.querySelector('#save-z').onclick = async ()=>{
    const code = overlay.querySelector('#z-code').value.trim().toUpperCase();
    const nom = overlay.querySelector('#z-nom').value.trim();
    if(!code){ toast('Le code de zone est requis'); return; }
    if(zones.some(z=>z.code===code)){ toast('Ce code de zone existe déjà'); return; }
    zones.push({ code, nom: nom || code });
    await saveZones();
    overlay.remove();
    toast('Zone créée');
    renderZones();
  };
}

function printZoneTag(zone){
  if(!zone) return;
  const area = document.getElementById('print-area');
  area.innerHTML = `
    <div class="print-tag">
      <div class="pcode">${escapeHtml(zone.code)}</div>
      <div class="pname">${escapeHtml(zone.nom)}</div>
      <div id="print-qr"></div>
    </div>
  `;
  new QRCode(document.getElementById('print-qr'), { text: zone.code, width: 140, height: 140 });
  setTimeout(()=> window.print(), 150);
}

/* ---------------------------------------------------------
   SCANNER
--------------------------------------------------------- */
let scanResultZone = null;
let scanNotFoundCode = null;

function renderScanner(){
  const view = document.getElementById('view');
  view.innerHTML = `
    <header class="page">
      <div>
        <div class="eyebrow">Localisation</div>
        <h1>Scanner une zone</h1>
        <div class="lede">Visez l'étiquette QR collée sur le rack pour afficher son contenu ou y affecter une tôle.</div>
      </div>
    </header>

    <div class="scanner-wrap">
      <div class="viewfinder" id="viewfinder">
        <div class="idle" id="scan-idle">
          <div>La caméra n'est pas encore active.</div>
          <button class="btn primary" id="start-scan">Démarrer le scanner</button>
        </div>
      </div>

      <div class="scan-panel">
        <div id="scan-result">
          <div class="banner">Aucune zone scannée pour le moment. Vous pouvez aussi saisir un code manuellement ci-dessous.</div>
        </div>
        <div class="manual-scan">
          <label>Saisie manuelle du code de zone</label>
          <div class="row">
            <input type="text" id="manual-code" placeholder="Ex. A1" style="flex:1">
            <button class="btn" id="manual-go">Valider</button>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('start-scan').onclick = startScanner;
  document.getElementById('manual-go').onclick = ()=>{
    const code = document.getElementById('manual-code').value.trim().toUpperCase();
    if(code) handleScanCode(code);
  };
  document.getElementById('manual-code').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ document.getElementById('manual-go').click(); }
  });
}

async function startScanner(){
  const vf = document.getElementById('viewfinder');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    vf.innerHTML = `<div class="idle">Accès caméra refusé ou indisponible.<br>Utilisez la saisie manuelle ci-dessous.</div>`;
    return;
  }
  vf.innerHTML = `
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="scan-line"></div>
  `;
  const video = document.getElementById('scan-video');
  video.srcObject = scanStream;
  await video.play();

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const tick = ()=>{
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      if(code && code.data){
        handleScanCode(code.data.trim().toUpperCase());
        return;
      }
    }
    scanRAF = requestAnimationFrame(tick);
  };
  scanRAF = requestAnimationFrame(tick);
}

function stopScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if(scanStream){
    scanStream.getTracks().forEach(tr=>tr.stop());
    scanStream = null;
  }
}

function handleScanCode(code){
  stopScanner();
  const zone = zones.find(z=>z.code === code);
  const panel = document.getElementById('scan-result');
  const vf = document.getElementById('viewfinder');
  if(vf){
    vf.innerHTML = `<div class="idle">Code lu : <b style="color:var(--ink)">${escapeHtml(code)}</b><br><button class="btn small" id="rescan-btn" style="margin-top:8px">Scanner à nouveau</button></div>`;
    document.getElementById('rescan-btn').onclick = startScanner;
  }
  if(!panel) return;

  if(zone){
    const items = toles.filter(t=>t.zone===zone.code);
    panel.innerHTML = `
      <div class="result-card found">
        <div class="tag-code">${escapeHtml(zone.code)}</div>
        <div class="tag-name" style="margin-bottom:12px">${escapeHtml(zone.nom)}</div>
        ${items.length===0 ? `<div class="lede" style="margin:0 0 12px">Aucune tôle affectée à cette zone pour l'instant.</div>` : `
          <table style="margin-bottom:12px">
            <thead><tr><th>Référence</th><th>Nuance</th><th>Dimensions</th><th>Qté</th></tr></thead>
            <tbody>
              ${items.map(t=>`<tr><td class="ref">${escapeHtml(t.ref)}</td><td class="dim">${t.nuance ? escapeHtml(t.nuance) : '—'}</td><td class="dim">${t.longueur}×${t.largeur}×${t.epaisseur}mm</td><td>${t.qte}</td></tr>`).join('')}
            </tbody>
          </table>
        `}
        <button class="btn primary small" id="add-here">+ Ajouter une tôle dans cette zone</button>
      </div>
    `;
    document.getElementById('add-here').onclick = ()=> openToleModal(null, zone.code);
  }else{
    panel.innerHTML = `
      <div class="result-card notfound">
        <div class="tag-code">${escapeHtml(code)}</div>
        <div class="lede" style="margin:6px 0 12px">Cette zone n'existe pas encore dans le système.</div>
        <button class="btn primary small" id="create-zone-here">Créer cette zone</button>
      </div>
    `;
    document.getElementById('create-zone-here').onclick = ()=>{
      zones.push({ code, nom: code });
      saveZones();
      toast('Zone créée');
      handleScanCode(code);
    };
  }
}

/* ---------------------------------------------------------
   UTIL
--------------------------------------------------------- */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
(async function init(){
  document.getElementById('view').innerHTML = `<div class="lede">Chargement du stock…</div>`;
  await loadData();
  render();
})();
</script>
