let scanStream = null;
let liveScanTimer = null;
let liveScanActive = false;

async function startLiveScanner(){
  const vf = document.getElementById('viewfinder');
  vf.innerHTML = `<div class="idle">Ouverture de la caméra…</div>`;
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    console.error(e);
    vf.innerHTML = `<div class="idle">Accès caméra refusé ou indisponible.<br>Utilisez plutôt "Prendre une photo" ci-dessous.</div>`;
    return;
  }
  vf.innerHTML = `
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="scan-line"></div>
  `;
  const video = document.getElementById('scan-video');
  video.srcObject = scanStream;
  await video.play();

  const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  liveScanActive = true;
  let busy = false;

  liveScanTimer = setInterval(async ()=>{
    if(busy || !liveScanActive || video.readyState < video.HAVE_ENOUGH_DATA) return;
    busy = true;
    try{
      let value = null;
      if(detector){
        try{
          const results = await detector.detect(video);
          if(results && results.length) value = results[0].rawValue;
        }catch(err){ /* on retente avec jsQR ci-dessous sur cette même image */ }
      }
      if(!value){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
        if(code && code.data) value = code.data;
      }
      if(value){
        stopLiveScanner();
        handleScanCode(value.trim().toUpperCase());
      }
    } finally {
      busy = false;
    }
  }, 350);
}

function stopLiveScanner(){
  liveScanActive = false;
  if(liveScanTimer){ clearInterval(liveScanTimer); liveScanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream = null; }
}

async function tryNativeBarcodeDetector(img){
  if(!('BarcodeDetector' in window)) return null;
  try{
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    const results = await detector.detect(img);
    if(results && results.length && results[0].rawValue) return results[0].rawValue;
  }catch(err){
    console.warn('BarcodeDetector indisponible ou en échec, repli sur jsQR:', err);
  }
  return null;
}

function decodeQrFromCanvas(ctx, w, h){
  const imgData = ctx.getImageData(0, 0, w, h);
  return jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
}

function tryDecodeAtScale(img, maxDim){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const scale = Math.min(1, maxDim / Math.max(nw, nh));
  const w = Math.max(1, Math.round(nw * scale));
  const h = Math.max(1, Math.round(nh * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  return decodeQrFromCanvas(ctx, w, h);
}

function tryDecodeCropped(img, cropFraction, targetSize){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const cropW = nw * cropFraction, cropH = nh * cropFraction;
  const sx = (nw - cropW) / 2, sy = (nh - cropH) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = targetSize; canvas.height = targetSize;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, targetSize, targetSize);
  return decodeQrFromCanvas(ctx, targetSize, targetSize);
}

async function onQrPhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const vf = document.getElementById('viewfinder');
  vf.innerHTML = `<div class="idle">Analyse de la photo…</div>`;

  const img = new Image();
  const url = URL.createObjectURL(file);

  img.onload = async ()=>{
    URL.revokeObjectURL(url);
    try{
      // 0. Détecteur natif du navigateur (même moteur que l'appareil photo du téléphone) — le plus fiable
      const native = await tryNativeBarcodeDetector(img);
      if(native){
        handleScanCode(native.trim().toUpperCase());
        return;
      }

      const nw = img.naturalWidth, nh = img.naturalHeight;
      let code = null;

      // 1. Repli : jsQR sur l'image entière, à plusieurs résolutions
      for(const maxDim of [2000, 1200, Math.max(nw, nh), 800]){
        code = tryDecodeAtScale(img, maxDim);
        if(code && code.data) break;
      }

      // 2. Repli : recadrage automatique sur le centre, agrandi
      if(!code || !code.data){
        for(const cropFraction of [0.6, 0.4, 0.25, 0.15]){
          code = tryDecodeCropped(img, cropFraction, 900);
          if(code && code.data) break;
        }
      }

      if(code && code.data){
        handleScanCode(code.data.trim().toUpperCase());
      }else{
        showScanFailure("Aucun QR code détecté sur cette photo.<br>Essayez de vous rapprocher un peu plus de l'étiquette et évitez les reflets.");
      }
    }catch(err){
      console.error('Erreur analyse QR:', err);
      showScanFailure("Erreur pendant l'analyse de la photo.<br>Réessayez avec une photo moins zoomée.");
    }
  };
  img.onerror = ()=>{
    showScanFailure("Impossible de lire cette photo.");
  };
  img.src = url;
}

}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function startApp(user){
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('ruler').style.display = '';
  document.getElementById('sidebar').style.display = '';
  document.getElementById('main-view').style.display = '';
  document.getElementById('app-version-side').textContent = `v${APP_VERSION} · ${APP_VERSION_DATE}`;
  document.getElementById('sidebar-foot').innerHTML = `
    <div class="user-chip">
      <span class="dot"></span>${escapeHtml(user.email)}
      <button id="logout-btn">Se déconnecter</button>
    </div>

  document.getElementById('logout-btn').addEventListener('click', ()=> auth.signOut());
  document.getElementById('view').innerHTML = `<div class="lede">Chargement du stock…</div>`;

}

function authGateHtml(mode, error){
  const isSignup = mode === 'signup';
  return `
    <div class="auth-box">
      <div class="auth-brand">TÔLE<span>RIE</span></div>
      <div class="auth-sub">${isSignup ? 'Créer un compte pour accéder au stock' : 'Connexion à la gestion de stock'}</div>
      <form id="auth-form">
        <div class="field"><label>E-mail</label><input type="email" id="auth-email" required autofocus></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="auth-password" required minlength="6"></div>
        ${error ? `<div class="auth-error">${escapeHtml(error)}</div>` : ''}
        <button type="submit" class="btn primary" style="width:100%;justify-content:center;">${isSignup ? 'Créer le compte' : 'Se connecter'}</button>
      </form>
      <div class="auth-switch">
        ${isSignup
          ? `Tu as déjà un compte ? <a id="auth-switch-link">Se connecter</a>`
          : `Pas encore de compte ? <a id="auth-switch-link">En créer un</a>`}
      </div>
    </div>`;
}

function renderAuthGate(mode, error){
  const gate = document.getElementById('auth-gate');
  gate.style.display = 'flex';
  gate.innerHTML = authGateHtml(mode, error) + `<div style="position:fixed;bottom:12px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-dim);">Version ${APP_VERSION} · ${APP_VERSION_DATE}</div>`;
  document.getElementById('auth-switch-link').addEventListener('click', ()=>{
    renderAuthGate(mode === 'signup' ? 'login' : 'signup');
  });
  document.getElementById('auth-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try{
      if(mode === 'signup'){
        await auth.createUserWithEmailAndPassword(email, password);
      }else{
        await auth.signInWithEmailAndPassword(email, password);
      }
      // onAuthStateChanged prendra le relais
    }catch(err){
      const messages = {
        'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail — connecte-toi plutôt.',
        'auth/invalid-email': 'Adresse e-mail invalide.',
        'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
        'auth/user-not-found': 'Aucun compte avec cet e-mail — crée-en un.',
        'auth/wrong-password': 'Mot de passe incorrect.',
        'auth/invalid-credential': 'Identifiant ou mot de passe incorrect.',
      };
      renderAuthGate(mode, messages[err.code] || 'Une erreur est survenue. Réessaie.');
    }
  });
}

auth.onAuthStateChanged(user => {
  if(user){
    startApp(user);
  }else{
    detachListeners();
    document.getElementById('ruler').style.display = 'none';
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('main-view').style.display = 'none';
    renderAuthGate('login');
  }
});

--------------------------------------------------------- */
let deferredInstallPrompt = null;
function isIosDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function isStandaloneApp(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});

function showInstallBanner(kind){
  if(isStandaloneApp()) return;
  if(localStorage.getItem('tolerie-install-dismissed')) return;
  const el = document.getElementById('install-banner');
  el.style.display = 'flex';
  el.className = 'install-banner';
  if(kind === 'ios'){
    el.innerHTML = `<span>Sur iPhone : appuie sur <b>Partager</b> puis <b>« Sur l'écran d'accueil »</b> pour installer l'application.</span><button class="close-x" id="install-dismiss">×</button>`;
  }else{
    el.innerHTML = `<span>Installe cette application sur ton écran d'accueil pour un accès rapide.</span><button class="btn small" id="install-go">Installer</button><button class="close-x" id="install-dismiss">×</button>`;
    document.getElementById('install-go').addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      el.style.display = 'none';
    });
  }
  document.getElementById('install-dismiss').addEventListener('click', ()=>{
    el.style.display = 'none';
    localStorage.setItem('tolerie-install-dismissed', '1');
  });
}

if(isIosDevice() && !isStandaloneApp()){
  showInstallBanner('ios');
}

/* ---------------------------------------------------------
   EMBOUTISSAGE — PIÈCE
   (reprend le classeur « calcul prix outillage & matériaux » :
   feuille "pièce FERM INF PIED AVT" — mêmes données, mêmes formules)
--------------------------------------------------------- */
function defaultEmbPiece(){
  return {
    nom: '',
    qteLancement: 5,
    epaisseur: 1.5,
    longueurFlanc: 1000,
    largeurFlanc: 500,
    nbDecoupes: 0,
    diametreDecoupes: 5,
    nbPli: 0,
    nbSoudures: 0,
    vitesseLaser: 2000,
    vitesseDebit: 50,
    hauteurCoupeDebit: 0,
    tempsEmboutissageMin: 0,
    tempsPliageMin: 0,
    tempsMontageOutilMin: 0,
    decoupesLaser5axes: 0,
    tempsControleMin: 0,
    coutAdmin: 30,
    coutAccessoire: 0,
    coutMatiere: 0,
    coutEmballage: 5,
    coutSousTraitance: 0,
    coutDivers: 0,
    margeAppliquee: 0.25,
    matiere: 'Acier',
    prixKgMatiere: null, // null = prix au kilo de la matière défini dans Paramètres, modifiable pièce par pièce
    longueurDetourage: null, // null = calculée (contour du flanc + trous), modifiable à la main
    priseEnCharge: 0, // outillage + programme : valeur fixe, affichée en bas de devis, hors coût pièce
    pieceFileName: '',
    dateCreation: null, dateModification: null
  };
}

function computePiece(p){
  const mat = getMatiere(p.matiere);
  const poidsPiece = (p.longueurFlanc * p.largeurFlanc) * p.epaisseur * (mat.densite/1000000);
  const longueurCoupeAuto = (p.longueurFlanc + p.largeurFlanc + (p.nbDecoupes/2*3.2*p.diametreDecoupes)) * 2;
  const longueurCoupe = (p.longueurDetourage!=null && p.longueurDetourage>0) ? p.longueurDetourage : longueurCoupeAuto;
  const tempsDecoupeMin = p.vitesseLaser>0 ? longueurCoupe / p.vitesseLaser : 0;
  const tempsDecoupeLotMin = tempsDecoupeMin * p.qteLancement;
  const tempsDebitMin = 0.5 + (p.vitesseDebit>0 ? p.hauteurCoupeDebit / p.vitesseDebit : 0);

  const tLaserH = longueurCoupe===0 ? 0 : (15 + tempsDecoupeMin*p.qteLancement)/60;
  const tDebitH = p.hauteurCoupeDebit===0 ? 0 : (7 + tempsDebitMin*p.qteLancement)/60;
  const tEmbH = p.nbPli===0 ? 0 : (15 + p.tempsEmboutissageMin*p.qteLancement)/60;
  const tPliageH = (p.tempsPliageMin*p.qteLancement)/60;
  const tMontageH = p.tempsMontageOutilMin===0 ? 0 : (7 + p.tempsMontageOutilMin*p.qteLancement)/60;
  const tLaser5axH = p.decoupesLaser5axes===0 ? 0 : (30 + p.decoupesLaser5axes*p.qteLancement)/60;
  const tCondH = p.tempsControleMin===0 ? 0 : (7 + p.tempsControleMin*p.qteLancement)/60;
  const tempsTotalH = tLaserH+tDebitH+tEmbH+tPliageH+tMontageH+tLaser5axH+tCondH;

  const coutLaser = tLaserH*115;
  const coutDebit = tDebitH*65;
  const coutEmbFab = tEmbH*90;
  const coutPliage = tPliageH*90;
  const coutRepriseMontage = tMontageH*65;
  const coutLaser5Ax = tLaser5axH*150;
  const coutCondition = tCondH*40;

  const poidsLot = poidsPiece*p.qteLancement;
  const coutLogistique = poidsLot < 30 ? 25 : (poidsLot < 100 ? poidsLot*0.5 : poidsLot*0.35);

  // Matière : calculée (poids du lot × prix/kg) tant qu'aucun montant n'est saisi à la main
  const prixKg = p.prixKgMatiere!=null ? p.prixKgMatiere : mat.prixKg;
  const coutMatiereAuto = poidsLot * prixKg;
  const coutMatiere = (p.coutMatiere>0) ? p.coutMatiere : coutMatiereAuto;

  const coutGlobal = (p.coutAdmin||0) + (p.coutAccessoire||0) + coutMatiere + coutLaser + coutDebit + coutEmbFab + coutPliage
    + coutRepriseMontage + coutLaser5Ax + coutCondition + (p.coutEmballage||0) + (p.coutSousTraitance||0) + coutLogistique + (p.coutDivers||0);
  const coutPieceUnit = p.qteLancement>0 ? coutGlobal/p.qteLancement : 0;
  const prixVente = coutPieceUnit + coutPieceUnit*(p.margeAppliquee||0);
  const prixVenteGlobal = prixVente*p.qteLancement;

  return { poidsPiece, longueurCoupe, longueurCoupeAuto, tempsDecoupeMin, tempsDecoupeLotMin, tempsDebitMin, coutMatiere, coutMatiereAuto, prixKg,
    tLaserH, tDebitH, tEmbH, tPliageH, tMontageH, tLaser5axH, tCondH, tempsTotalH,
    coutLaser, coutDebit, coutEmbFab, coutPliage, coutRepriseMontage, coutLaser5Ax, coutCondition, coutLogistique,
    coutGlobal, coutPieceUnit, prixVente, prixVenteGlobal };
}

            </tr>`).join('')}

      </div>

  `;

  document.getElementById('emb-piece-new').onclick = ()=>{
    embPieceEditing = Object.assign(defaultEmbPiece(), { id: uid() });
    embPieceWireframe = null;
    render();
  };
  embPieces.forEach(p=>{
    const editBtn = document.querySelector(`[data-emb-edit="${p.id}"]`);
    if(editBtn) editBtn.onclick = ()=>{ embPieceEditing = JSON.parse(JSON.stringify(p)); embPieceWireframe = null; render(); };
    const delBtn = document.querySelector(`[data-emb-del="${p.id}"]`);
    if(delBtn) delBtn.onclick = async ()=>{
      if(!(await askConfirm(`Supprimer la pièce <b>${escapeHtml(p.nom||'(sans nom)')}</b> ?`))) return;
      embPieces = embPieces.filter(x=>x.id!==p.id);
      await saveEmbPieces();
      toast('Pièce supprimée');
      render();
    };
  });
}

      { key:'laser5axprog', label:'Programme laser 5 axes', enabled:true, hg:2, chg:85, hd:2, chd:85 },

/* Densité de l'acier (kg/m³), utilisée pour chiffrer le poids — donc le coût matière —
   de la matrice, du poinçon et du serre-flan à partir de leur seul volume. */
const DENSITE_ACIER_KG_M3 = 7850;

/* Cherche dans l'abaque d'usinage le bloc dont le volume est le plus proche de celui demandé
   (longueur/largeur/hauteur en mm) — sert uniquement à estimer le temps d'usinage (ligne
   "Usinage" de la main d'oeuvre), le coût matière étant calculé par poids × prix/kg. */
function findAbaqueMatch(l, w, h){
  if(!l || !w || !h) return null;
  const vol = l*w*h*1e-9;
  let best = null, bestDiff = Infinity;
  ABAQUE_USINAGE.forEach(a=>{
    const v = a.l*a.w*a.h*1e-9;
    const diff = Math.abs(v-vol);
    if(diff < bestDiff){ bestDiff = diff; best = a; }
  });
  if(!best) return null;
  return { ref: best, volumeDemande: vol, prixUsinage: best.prixUsinage, prixMatiere: best.prixMatiere, nbHeureUsinage: best.prixUsinage/85 };
}

/* Lecture approximative d'un fichier STEP : boîte englobante 3D à partir des sommets réels de la
   pièce (VERTEX_POINT). Comme pour l'imbrication, c'est une approximation (pas de vraie géométrie
   CAO) — à vérifier. On exclut volontairement les CARTESIAN_POINT qui ne sont pas des sommets
   (origines de repères, points de construction des courbes) : les inclure fait exploser la boîte
   englobante, en général jusqu'à l'origine (0,0,0) du repère global de l'assemblage. */
function parseStepBoundingBox3D(text){
  const pts = stepCartesianPoints(text);
  const vertexRe = /VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m, minX=Infinity, minY=Infinity, minZ=Infinity, maxX=-Infinity, maxY=-Infinity, maxZ=-Infinity, found=0;
  while((m = vertexRe.exec(text))){
    const v = pts[m[1]];
    if(!v || v.length<3) continue;
    found++;
    if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
    if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
    if(v[2]<minZ)minZ=v[2]; if(v[2]>maxZ)maxZ=v[2];
  }
  if(!found){
    Object.values(pts).forEach(v=>{
      if(v.length<3) return;
      if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
      if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
      if(v[2]<minZ)minZ=v[2]; if(v[2]>maxZ)maxZ=v[2];
    });
  }
  if(!isFinite(minX)) throw new Error('Aucun point exploitable trouvé dans le fichier STEP.');
  const longueur = Math.round(maxX-minX), largeur = Math.round(maxY-minY), hauteur = Math.round(maxZ-minZ);
  return { longueur, largeur, hauteur, volume: (longueur*largeur*hauteur)/1e9 };
}

/* ---------------------------------------------------------
   VISUALISATION APPROXIMATIVE D'UN FICHIER STEP (fil de fer)
   On reconstruit chaque arête de la pièce (EDGE_CURVE) :
   - les arêtes portées par une B-spline (B_SPLINE_CURVE_WITH_KNOTS, non rationnelle) sont
     échantillonnées par l'algorithme de De Boor pour suivre la vraie courbe ;
   - les autres (LINE, CIRCLE...) sont tracées en corde droite entre les deux sommets de l'arête.
   C'est une approximation filaire (pas un rendu solide), suffisante pour vérifier la forme
   générale de la pièce avant usinage de l'outil.
--------------------------------------------------------- */
function parseStepWireframe(text){
  const pts = stepCartesianPoints(text);

  const vertexPt = {};
  const vertexRe = /#(\d+)\s*=\s*VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m;
  while((m = vertexRe.exec(text))){ const p = pts[m[2]]; if(p) vertexPt[m[1]] = p; }

  const bsplines = {};
  const bsRe = /#(\d+)\s*=\s*B_SPLINE_CURVE_WITH_KNOTS\s*\(\s*'[^']*'\s*,\s*(\d+)\s*,\s*\(([^)]+)\)\s*,[^,]+,[^,]+,[^,]+,\s*\(([^)]+)\)\s*,\s*\(([^)]+)\)/g;
  while((m = bsRe.exec(text))){
    bsplines[m[1]] = {
      degree: parseInt(m[2], 10),
      cpIds: m[3].split(',').map(s=>s.trim().replace('#','')),
      knotMult: m[4].split(',').map(s=>parseInt(s.trim(),10)),
      knotVals: m[5].split(',').map(s=>parseFloat(s.trim()))
    };
  }

  const edges = [];
  const edgeRe = /#(\d+)\s*=\s*EDGE_CURVE\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*,\s*#(\d+)\s*,\s*#(\d+)\s*,\s*\.[TF]\.\s*\)/g;
  while((m = edgeRe.exec(text))){ edges.push({ v1:m[2], v2:m[3], curve:m[4] }); }

  function expandKnots(mult, vals){
    const out = [];
    for(let i=0;i<mult.length;i++) for(let j=0;j<mult[i];j++) out.push(vals[i]);
    return out;
  }
  // Algorithme de De Boor : évalue un point sur une B-spline (non rationnelle) de degré p,
  // vecteur de noeuds U, points de contrôle Pw, au paramètre u.
  function deBoor(p, U, Pw, u){
    const n = Pw.length - 1;
    let k = p;
    while(k < n && u >= U[k+1]) k++;
    if(u >= U[U.length-1-p]) k = n;
    const d = [];
    for(let i=0;i<=p;i++) d[i] = Pw[k-p+i].slice();
    for(let r=1;r<=p;r++){
      for(let i=p;i>=r;i--){
        const denom = U[k+1+i-r] - U[k+i-p];
        const alpha = denom!==0 ? (u - U[k+i-p])/denom : 0;
        d[i] = [0,1,2].map(ax => (1-alpha)*d[i-1][ax] + alpha*d[i][ax]);
      }
    }
    return d[p];
  }

  const polylines = [];
  edges.forEach(e=>{
    const p1 = vertexPt[e.v1], p2 = vertexPt[e.v2];
    if(!p1 || !p2) return;
    const bs = bsplines[e.curve];
    if(bs){
      const cps = bs.cpIds.map(id=>pts[id]);
      if(cps.every(Boolean) && cps.length > bs.degree){
        const U = expandKnots(bs.knotMult, bs.knotVals);
        const uStart = U[bs.degree], uEnd = U[U.length-1-bs.degree];
        const N = 10;
        const line = [];
        for(let i=0;i<=N;i++){
          const u = (i===N) ? uEnd - 1e-9 : uStart + (uEnd-uStart)*(i/N);
          line.push(deBoor(bs.degree, U, cps, u));
        }
        polylines.push(line);
        return;
      }
    }
    polylines.push([p1, p2]);
  });
  return polylines;
}

/* Construit le SVG du viewer (projection 2D sur les deux axes de plus grande étendue).
   mirrorPolylines, si fourni, est tracé en plus (en rouge) — utilisé pour prévisualiser
   la pièce et son symétrique côte à côte. */
function buildStepWireframeSvg(polylines, mirrorPolylines){
  const allPts = [];
  polylines.forEach(line=>line.forEach(p=>allPts.push(p)));
  if(mirrorPolylines) mirrorPolylines.forEach(line=>line.forEach(p=>allPts.push(p)));
  if(!allPts.length) return '<div class="empty" style="padding:24px;">Aucune géométrie exploitable dans ce fichier.</div>';

  const ranges = [0,1,2].map(ax=>{
    let mn=Infinity, mx=-Infinity;
    allPts.forEach(p=>{ if(p[ax]<mn)mn=p[ax]; if(p[ax]>mx)mx=p[ax]; });
    return { ax, mn, mx, span: mx-mn };
  }).sort((a,b)=> b.span - a.span);
  const uRange = ranges[0], vRange = ranges[1];

  const w = Math.max(1, uRange.span), h = Math.max(1, vRange.span);
  const pad = Math.max(w,h)*0.05;
  const vbW = w+pad*2, vbH = h+pad*2;
  const sx = p => (p[uRange.ax]-uRange.mn+pad).toFixed(2);
  const sy = p => (vbH - (p[vRange.ax]-vRange.mn+pad)).toFixed(2);
  const strokeW = (Math.max(w,h)*0.0025).toFixed(3);

  function pathFor(lines, color){
    return lines.map(line=>{
      const d = line.map(p=>`${sx(p)},${sy(p)}`).join(' ');
      return `<polyline points="${d}" fill="none" stroke="${color}" stroke-width="${strokeW}"/>`;
    }).join('');
  }

  return `<svg width="100%" height="100%" viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet" style="background:#fff;display:block;">
    <g>${pathFor(polylines, '#1a1a1a')}</g>
    ${mirrorPolylines ? `<g>${pathFor(mirrorPolylines, '#c1443c')}</g>` : ''}
  </svg>`;
}

/* Calcule la pièce symétrique (miroir sur l'axe X=0 ou Y=1), accolée avec un espace de 50 mm,
   pour une prévisualisation côte à côte — même logique que l'effet "symétrique" de l'outillage. */
function mirrorStepWireframe(polylines, axisIndex, gap){
  let mx = -Infinity;
  polylines.forEach(line=>line.forEach(p=>{ if(p[axisIndex]>mx) mx=p[axisIndex]; }));
  if(!isFinite(mx)) return polylines;
  return polylines.map(line=>line.map(p=>{
    const q = p.slice();
    q[axisIndex] = 2*mx + gap - p[axisIndex];
    return q;
  }));
}

function computeOutil(o){
  // Outillage symétrique : si l'outil produit la pièce et son symétrique en une seule frappe,
  // on double la dimension pièce sur l'axe choisi (X ou Y) et on ajoute 50 mm (espace entre les deux moitiés)
  // avant de dimensionner matrice / poinçon / serre-flan.
  const isSym = o.symetrique === true;
  const symAxe = o.symetrieAxe === 'Y' ? 'Y' : 'X';
  const effLongueur = (isSym && symAxe==='X') ? (o.pieceLongueur*2 + 50) : o.pieceLongueur;
  const effLargeur = (isSym && symAxe==='Y') ? (o.pieceLargeur*2 + 50) : o.pieceLargeur;

  // Dimensions calculées automatiquement — modifiables ensuite à la main (override), sinon elles suivent la formule.
  const matriceLCalc = effLongueur+160, matriceWCalc = effLargeur+160, matriceHCalc = o.pieceHauteur+50;
  const poinconLCalc = effLongueur, poinconWCalc = effLargeur, poinconHCalc = Math.max(o.pieceHauteur+50, 100);
  const matriceL = o.matriceLOverride!=null ? o.matriceLOverride : matriceLCalc;
  const matriceW = o.matriceWOverride!=null ? o.matriceWOverride : matriceWCalc;
  const matriceH = o.matriceHOverride!=null ? o.matriceHOverride : matriceHCalc;
  const poinconL = o.poinconLOverride!=null ? o.poinconLOverride : poinconLCalc;
  const poinconW = o.poinconWOverride!=null ? o.poinconWOverride : poinconWCalc;
  const poinconH = o.poinconHOverride!=null ? o.poinconHOverride : poinconHCalc;
  const hasSerreFlan = o.hasSerreFlan !== false;
  const serreFlanL = hasSerreFlan ? matriceL : 0, serreFlanW = hasSerreFlan ? matriceW : 0, serreFlanH = hasSerreFlan ? 30 : 0;

  // Coût matière = volume (m³) × densité acier (kg/m³) = poids (kg) × prix/kg (42CMD8, par défaut 4€).
  const matOutil = getMatiere('42CMD8');
  const prixKg = o.prixKgMatiere != null ? o.prixKgMatiere : matOutil.prixKg;
  const densiteKgM3 = (matOutil.densite>0 ? matOutil.densite : 7.85)*1000;
  const matriceVolume = matriceL*matriceW*matriceH*1e-9;
  const matricePoids = matriceVolume*densiteKgM3;
  const matriceCoutMatiere = matricePoids*prixKg;
  const poinconVolume = poinconL*poinconW*poinconH*1e-9;
  const poinconPoids = poinconVolume*densiteKgM3;
  const poinconCoutMatiere = poinconPoids*prixKg;
  const serreFlanVolume = hasSerreFlan ? serreFlanL*serreFlanW*serreFlanH*1e-9 : 0;
  const serreFlanPoids = serreFlanVolume*densiteKgM3;
  const serreFlanCoutMatiere = hasSerreFlan ? serreFlanPoids*prixKg : 0;

  const matiereTotal = matriceCoutMatiere + poinconCoutMatiere + serreFlanCoutMatiere;

  // Coût d'usinage de la matrice et du poinçon = leur volume (m³) × le prix moyen au m³ de
  // l'abaque d'usinage (par défaut) — modifiable. Le temps (heures) qui en découle vient
  // alimenter automatiquement la ligne "Usinage" de la main d'oeuvre, tant que l'utilisateur
  // n'a pas saisi sa propre valeur.
  const prixUsinageM3 = o.prixUsinageM3 != null ? o.prixUsinageM3 : abaqueMoyennePrixM3();
  const matriceCoutUsinage = matriceVolume*prixUsinageM3;
  const poinconCoutUsinage = poinconVolume*prixUsinageM3;
  const usinageRowDef = (o.moRows||[]).find(r=>r.key==='usinage') || {};
  const tarifUsinageG = usinageRowDef.chg || 120;
  const tarifUsinageD = usinageRowDef.chd || 120;
  const matriceHeuresUsinageG = tarifUsinageG>0 ? matriceCoutUsinage/tarifUsinageG : 0;
  const poinconHeuresUsinageG = tarifUsinageG>0 ? poinconCoutUsinage/tarifUsinageG : 0;
  const matriceHeuresUsinageD = tarifUsinageD>0 ? matriceCoutUsinage/tarifUsinageD : 0;
  const poinconHeuresUsinageD = tarifUsinageD>0 ? poinconCoutUsinage/tarifUsinageD : 0;
  const heuresUsinageAutoG = matriceHeuresUsinageG + poinconHeuresUsinageG;
  const heuresUsinageAutoD = matriceHeuresUsinageD + poinconHeuresUsinageD;

  const rows = (o.moRows||[]).map(r=>{
    const on = r.enabled !== false;
    let hg = r.hg, hd = r.hd;
    if(r.key==='usinage' && (hg==null || hg==='')) hg = heuresUsinageAutoG;
    if(r.key==='usinage' && (hd==null || hd==='')) hd = heuresUsinageAutoD;
    hg = hg||0; hd = hd||0;
    return Object.assign({}, r, { hg, hd, totG: on ? hg*(r.chg||0) : 0, totD: on ? hd*(r.chd||0) : 0 });
  });
  const sumG = rows.reduce((s,r)=>s+r.totG,0);
  const sumD = rows.reduce((s,r)=>s+r.totD,0);
  const totalMainG = sumG + matiereTotal;
  const totalMainD = sumD + matiereTotal;
  return { matriceL, matriceW, matriceH, poinconL, poinconW, poinconH, serreFlanL, serreFlanW, serreFlanH, hasSerreFlan,
    matriceLCalc, matriceWCalc, matriceHCalc, poinconLCalc, poinconWCalc, poinconHCalc,
    isSym, symAxe, effLongueur, effLargeur,
    matriceVolume, matricePoids, matriceCoutMatiere,
    poinconVolume, poinconPoids, poinconCoutMatiere,
    serreFlanVolume, serreFlanPoids, serreFlanCoutMatiere,
    prixKg, prixUsinageM3, matriceCoutUsinage, poinconCoutUsinage,
    matriceHeuresUsinageG, poinconHeuresUsinageG, heuresUsinageAutoG, heuresUsinageAutoD,
    matiereTotal, rows, sumG, sumD, totalMainG, totalMainD };
}

/* Prix moyen au m³ de l'abaque d'usinage (prix usinage / volume de chaque bloc, moyenné) —
   valeur par défaut utilisée pour chiffrer l'usinage de la matrice et du poinçon à partir
   de leur seul volume. */
function abaqueMoyennePrixM3(){
  const vals = ABAQUE_USINAGE.map(a=>{ const v=a.l*a.w*a.h*1e-9; return v>0 ? a.prixUsinage/v : 0; }).filter(v=>v>0);
  return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
}

  const poidsCard = (title, L, W, H, volume, poids, coutMatiere) => `
    <div class="result-card">
      <div style="font-weight:600;">${title} — ${L}×${W}×${H} mm</div>
      <div style="font-size:12px;color:var(--ink-dim);margin-top:6px;">Volume : ${volume.toFixed(5)} m³ · Poids : ${poids.toFixed(2)} kg</div>
      <div style="font-family:var(--display);font-size:20px;margin-top:8px;">${coutMatiere.toFixed(2)} €</div>
      <div style="font-size:12px;color:var(--ink-dim);">coût matière (poids × prix/kg)</div>
    </div>`;

  const usinageCard = (title, volume, cout, heures) => `
    <div class="result-card">
      <div style="font-weight:600;">${title}</div>
      <div style="font-size:12px;color:var(--ink-dim);margin-top:6px;">Volume : ${volume.toFixed(5)} m³ · ≈ ${heures.toFixed(1)} h au tarif retenu</div>
      <div style="font-family:var(--display);font-size:20px;margin-top:8px;">${cout.toFixed(2)} €</div>
      <div style="font-size:12px;color:var(--ink-dim);">coût usinage (volume × prix moyen /m³)</div>
    </div>`;

  // Cellule de dimension matrice/poinçon : pré-remplie avec la valeur calculée, modifiable à la main ;
  // un bouton ⤾ apparaît une fois modifiée pour revenir au calcul automatique.
  const dimCell = (overrideField, overrideVal, currentVal, calcVal) => `
    <div style="display:flex;align-items:center;gap:4px;">
      <input type="number" data-dim-field="${overrideField}" value="${currentVal}" style="width:85px;">
      <span style="font-size:12px;color:var(--ink-dim);">mm</span>
      ${overrideVal!=null ? `<button class="btn ghost" data-dim-reset="${overrideField}" title="Revenir au calcul automatique (${calcVal} mm)" style="padding:2px 6px;">⤾</button>` : ''}
    </div>`;

  view.innerHTML = `
    <header class="page">
      <div>
        <div class="eyebrow">Emboutissage · Outillage</div>
        <h1>${o._fbId ? "Modifier l'outil" : "Nouvel outil"}</h1>
        <div class="lede">Entre les dimensions de la pièce (ou charge son fichier STEP) ; les dimensions de la matrice, du poinçon et du serre-flan se déduisent automatiquement, et leur coût matière se calcule à partir de leur poids (volume × densité acier) au prix du kilo.</div>
      </div>
    </header>

    <div class="modal" style="max-width:760px;margin:0 0 24px;box-shadow:none;">
      <div class="field"><label>Désignation de l'outil</label><input type="text" id="eo-nom" value="${escapeHtml(o.nom)}" placeholder="Ex. FERM INF PIED AVT"></div>

      <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:18px 0 10px;color:var(--ink-dim);">Dimensions de la pièce (mm)</h3>
      <div class="field">
        <label>Charger la pièce depuis un fichier STEP (prévoir 5 à 10/10 mm de plus par pièce)</label>
        <input type="file" id="eo-step-file" accept=".step,.stp">
        ${o.pieceFileName ? `<span class="hint" style="font-size:11px;color:var(--ink-dim);display:block;margin-top:4px;">Fichier chargé : ${escapeHtml(o.pieceFileName)}</span>` : ''}
        <span class="hint" style="font-size:11px;color:var(--ink-dim);display:block;margin-top:4px;">Lecture approximative (boîte englobante à partir des points 3D) — vérifie les 3 dimensions obtenues et corrige-les si besoin.</span>
      </div>
      <div class="grid3">
        <div class="field"><label>Longueur X</label><input type="number" data-ofield="pieceLongueur" value="${o.pieceLongueur}" min="0"></div>
        <div class="field"><label>Largeur Y</label><input type="number" data-ofield="pieceLargeur" value="${o.pieceLargeur}" min="0"></div>
        <div class="field"><label>Hauteur Z</label><input type="number" data-ofield="pieceHauteur" value="${o.pieceHauteur}" min="0"></div>
      </div>
      <div style="font-size:12px;color:var(--ink-dim);margin:-4px 0 4px;">Volume pièce (boîte englobante) : ${((o.pieceLongueur*o.pieceLargeur*o.pieceHauteur)/1e9).toFixed(5)} m³</div>

      <div class="field" style="margin-top:14px;">
        <label style="text-transform:none;letter-spacing:0;font-weight:500;"><input type="checkbox" id="eo-has-serreflan" ${o.hasSerreFlan!==false?'checked':''} style="width:auto;margin-right:8px;vertical-align:middle;">Un serre-flan est-il nécessaire pour cet outil ?</label>
      </div>

      <div class="field" style="margin-top:10px;">
        <label style="text-transform:none;letter-spacing:0;font-weight:500;"><input type="checkbox" id="eo-symetrique" ${o.symetrique?'checked':''} style="width:auto;margin-right:8px;vertical-align:middle;">Outillage symétrique (produit la pièce + son symétrique en une frappe) ?</label>
      </div>
      ${o.symetrique ? `
        <div class="field" style="max-width:280px;">
          <label>Axe de symétrie</label>
          <select id="eo-symetrie-axe">
            <option value="X" ${o.symetrieAxe!=='Y'?'selected':''}>X (longueur)</option>
            <option value="Y" ${o.symetrieAxe==='Y'?'selected':''}>Y (largeur)</option>
          </select>
        </div>
        <div style="font-size:12px;color:var(--ink-dim);margin:-4px 0 10px;">La dimension pièce sur l'axe ${c.symAxe} est doublée puis +50 mm avant de dimensionner l'outil : ${c.symAxe==='X'?`${o.pieceLongueur} → ${c.effLongueur} mm`:`${o.pieceLargeur} → ${c.effLargeur} mm`}.</div>
      ` : ''}

      ${embOutilWireframe ? `
        <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:18px 0 10px;color:var(--ink-dim);">Visualisation de la pièce${o.symetrique?' (en rouge : son symétrique)':''}</h3>
        <div style="overflow-x:auto;margin-bottom:8px;">
          <div id="step-viewer" class="dxf-viewer" style="width:100%;max-width:700px;height:420px;border:1px solid var(--line);border-radius:var(--radius);">
            ${buildStepWireframeSvg(embOutilWireframe, o.symetrique ? mirrorStepWireframe(embOutilWireframe, o.symetrieAxe==='Y'?1:0, 50) : null)}
            <div class="dxf-viewer-controls">
              <button data-zoom-in title="Zoomer">+</button>
              <button data-zoom-out title="Dézoomer">−</button>
              <button data-zoom-reset title="Réinitialiser">⤾</button>
            </div>
            <div class="dxf-viewer-hint">Molette / pincement = zoom · glisser = déplacer</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--ink-dim);margin:0 0 18px;">Visualisation filaire approximative reconstruite depuis le fichier STEP (projection 2D sur les deux plus grandes dimensions) — pas un rendu solide, à vérifier.</div>
      ` : ''}

      <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:18px 0 10px;color:var(--ink-dim);">Dimensions de l'outil (calculées — modifiables)</h3>
      <div style="font-size:12px;color:var(--ink-dim);margin-bottom:8px;">La matrice et le poinçon sont pré-remplis automatiquement à partir de la pièce ; corrige librement les valeurs si besoin, ou reviens au calcul automatique avec ⤾.</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th></th><th>Matrice</th><th>Poinçon</th>${c.hasSerreFlan?'<th>Serre-flan</th>':''}</tr></thead>
          <tbody>
            <tr>
              <td>Longueur</td>
              <td>${dimCell('matriceLOverride', o.matriceLOverride, c.matriceL, c.matriceLCalc)}</td>
              <td>${dimCell('poinconLOverride', o.poinconLOverride, c.poinconL, c.poinconLCalc)}</td>
              ${c.hasSerreFlan?`<td>${c.serreFlanL} mm</td>`:''}
            </tr>
            <tr>
              <td>Largeur</td>
              <td>${dimCell('matriceWOverride', o.matriceWOverride, c.matriceW, c.matriceWCalc)}</td>
              <td>${dimCell('poinconWOverride', o.poinconWOverride, c.poinconW, c.poinconWCalc)}</td>
              ${c.hasSerreFlan?`<td>${c.serreFlanW} mm</td>`:''}
            </tr>
            <tr>
              <td>Hauteur</td>
              <td>${dimCell('matriceHOverride', o.matriceHOverride, c.matriceH, c.matriceHCalc)}</td>
              <td>${dimCell('poinconHOverride', o.poinconHOverride, c.poinconH, c.poinconHCalc)}</td>
              ${c.hasSerreFlan?`<td>${c.serreFlanH} mm (fixe)</td>`:''}
            </tr>
          </tbody>
        </table>
      </div>

      <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:18px 0 10px;color:var(--ink-dim);">Coût matière — poids × prix au kilo</h3>
      <div class="field" style="max-width:280px;">
        <label>Prix du kilo (42CMD8) — défini dans Paramètres</label>
        <input type="number" step="0.01" id="eo-prix-kg" value="${c.prixKg}" min="0">
      </div>
      <div class="grid3">
        ${poidsCard('Matrice', c.matriceL, c.matriceW, c.matriceH, c.matriceVolume, c.matricePoids, c.matriceCoutMatiere)}
        ${poidsCard('Poinçon', c.poinconL, c.poinconW, c.poinconH, c.poinconVolume, c.poinconPoids, c.poinconCoutMatiere)}
        ${c.hasSerreFlan ? poidsCard('Serre-flan', c.serreFlanL, c.serreFlanW, c.serreFlanH, c.serreFlanVolume, c.serreFlanPoids, c.serreFlanCoutMatiere) : ''}
      </div>
      <div class="result-card" style="max-width:260px;margin-top:4px;"><div style="font-family:var(--display);font-size:18px;">${c.matiereTotal.toFixed(2)} €</div><div style="font-size:12px;color:var(--ink-dim);margin-top:4px;">total matière (poids × ${c.prixKg} €/kg)</div></div>

      <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:18px 0 10px;color:var(--ink-dim);">Coût usinage matrice &amp; poinçon — volume × prix moyen au m³</h3>
      <div class="field" style="max-width:280px;">
        <label>Prix moyen au m³ (abaque usinage, par défaut)</label>
        <input type="number" step="1" id="eo-prix-usinage-m3" value="${Math.round(c.prixUsinageM3)}" min="0">
      </div>
      <div class="grid2">
        ${usinageCard('Matrice', c.matriceVolume, c.matriceCoutUsinage, c.matriceHeuresUsinageG)}
        ${usinageCard('Poinçon', c.poinconVolume, c.poinconCoutUsinage, c.poinconHeuresUsinageG)}
      </div>
      <div style="font-size:12px;color:var(--ink-dim);margin-top:8px;">Ce temps d'usinage (${c.heuresUsinageAutoG.toFixed(1)} h au tarif MAIN G, ${c.heuresUsinageAutoD.toFixed(1)} h au tarif MAIN D) alimente automatiquement la ligne « Usinage » ci-dessous, tant qu'elle n'est pas modifiée à la main.</div>

      <h3 style="font-family:var(--display);font-size:14px;letter-spacing:.3px;margin:22px 0 10px;color:var(--ink-dim);">Main d'oeuvre de fabrication</h3>
      <div style="font-size:12px;color:var(--ink-dim);margin-bottom:8px;">Décoche une opération si elle ne s'applique pas à cet outil. Le temps d'« Usinage » reprend par défaut le nombre d'heures de l'abaque pour le bloc matrice le plus proche — modifiable.</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Inclus</th><th>Opération</th><th>MAIN G — heures</th><th>MAIN G — €/h</th><th>MAIN G — total</th><th>MAIN D — heures</th><th>MAIN D — €/h</th><th>MAIN D — total</th><th></th></tr></thead>
          <tbody>
            ${c.rows.map((r,i)=>`
              <tr ${r.enabled===false?'style="opacity:.5;"':''}>
                <td><input type="checkbox" data-mo-field="enabled" data-mo-idx="${i}" ${r.enabled!==false?'checked':''} style="width:auto;"></td>
                <td><input type="text" data-mo-field="label" data-mo-idx="${i}" value="${escapeHtml(r.label)}" style="width:170px;"></td>
                <td><input type="number" step="0.5" data-mo-field="hg" data-mo-idx="${i}" value="${r.hg}" style="width:70px;"></td>
                <td><input type="number" data-mo-field="chg" data-mo-idx="${i}" value="${r.chg}" style="width:70px;"></td>
                <td>${r.totG.toFixed(2)} €</td>
                <td><input type="number" step="0.5" data-mo-field="hd" data-mo-idx="${i}" value="${r.hd}" style="width:70px;"></td>
                <td><input type="number" data-mo-field="chd" data-mo-idx="${i}" value="${r.chd}" style="width:70px;"></td>
                <td>${r.totD.toFixed(2)} €</td>
                <td><button class="btn ghost" data-mo-del="${i}" title="Supprimer la ligne">✕</button></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:10px;">
        <button class="btn small" id="eo-add-row">+ Ajouter une ligne</button>
      </div>

      <div class="grid2" style="margin-top:16px;">
        <div class="result-card"><div style="font-family:var(--display);font-size:22px;">${c.totalMainG.toFixed(2)} €</div><div style="font-size:12px;color:var(--ink-dim);margin-top:4px;">total outil — MAIN G (matière + main d'oeuvre)</div></div>
        <div class="result-card"><div style="font-family:var(--display);font-size:22px;">${c.totalMainD.toFixed(2)} €</div><div style="font-size:12px;color:var(--ink-dim);margin-top:4px;">total outil — MAIN D (matière + main d'oeuvre)</div></div>
      </div>

      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn primary" id="eo-save">Enregistrer l'outil</button>
        <button class="btn" id="eo-cancel">Annuler</button>
      </div>
    </div>
  `;

  document.querySelectorAll('[data-ofield]').forEach(inp=>{
    inp.onchange = (e)=>{
      o[e.target.dataset.ofield] = parseFloat(e.target.value) || 0;
      // La pièce change : on repart des dimensions calculées pour la matrice/le poinçon.
      o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
      o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
      renderEmbOutilForm();
    };
  });
  document.querySelectorAll('[data-dim-field]').forEach(inp=>{
    inp.onchange = (e)=>{
      o[e.target.dataset.dimField] = parseFloat(e.target.value) || 0;
      renderEmbOutilForm();
    };
  });
  document.querySelectorAll('[data-dim-reset]').forEach(btn=>{
    btn.onclick = ()=>{
      o[btn.dataset.dimReset] = null;
      renderEmbOutilForm();
    };
  });
  document.getElementById('eo-nom').onchange = (e)=>{ o.nom = e.target.value; };
  document.getElementById('eo-has-serreflan').onchange = (e)=>{ o.hasSerreFlan = e.target.checked; renderEmbOutilForm(); };
  document.getElementById('eo-prix-kg').onchange = (e)=>{ o.prixKgMatiere = parseFloat(e.target.value) || 0; renderEmbOutilForm(); };
  document.getElementById('eo-prix-usinage-m3').onchange = (e)=>{ o.prixUsinageM3 = parseFloat(e.target.value) || 0; renderEmbOutilForm(); };
  document.getElementById('eo-symetrique').onchange = (e)=>{
    o.symetrique = e.target.checked;
    o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
    o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
    renderEmbOutilForm();
  };
  const symAxeSel = document.getElementById('eo-symetrie-axe');
  if(symAxeSel) symAxeSel.onchange = (e)=>{
    o.symetrieAxe = e.target.value;
    o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
    o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
    renderEmbOutilForm();
  };

  document.querySelectorAll('[data-mo-field]').forEach(inp=>{
    inp.onchange = (e)=>{
      const idx = parseInt(e.target.dataset.moIdx);
      const f = e.target.dataset.moField;
      if(f==='label') o.moRows[idx][f] = e.target.value;
      else if(f==='enabled') o.moRows[idx][f] = e.target.checked;
      else o.moRows[idx][f] = parseFloat(e.target.value)||0;
      renderEmbOutilForm();
    };
  });
  document.querySelectorAll('[data-mo-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.moDel);
      o.moRows.splice(idx,1);
      renderEmbOutilForm();
    };
  });
  document.getElementById('eo-add-row').onclick = ()=>{
    o.moRows.push({ key:'', label:'', enabled:true, hg:0, chg:0, hd:0, chd:0 });
    renderEmbOutilForm();
  };

  document.getElementById('eo-step-file').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const bbox = parseStepBoundingBox3D(text);
      o.pieceLongueur = bbox.longueur; o.pieceLargeur = bbox.largeur; o.pieceHauteur = bbox.hauteur;
      o.pieceFileName = file.name;
      o.nom = file.name.replace(/\.(stp|step)$/i, '');
      o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
      o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
      try{ embOutilWireframe = parseStepWireframe(text); }catch(werr){ console.error(werr); embOutilWireframe = null; }
      toast(`Pièce lue : ${bbox.longueur} × ${bbox.largeur} × ${bbox.hauteur} mm (volume ≈ ${bbox.volume.toFixed(5)} m³)`);
      renderEmbOutilForm();
    }catch(err){
      console.error(err);
      toast('Impossible de lire ce fichier : ' + err.message);
    }
  };

  document.getElementById('eo-save').onclick = async ()=>{
    if(!o.nom || !o.nom.trim()){ toast("Indique une désignation pour l'outil"); return; }
    if(!o.dateCreation) o.dateCreation = new Date().toISOString();
    const idx = embOutils.findIndex(x=>x.id===o.id);
    if(idx>=0) embOutils[idx] = o; else embOutils.push(o);
    await saveEmbOutils();
    toast('Outil enregistré');
    embOutilEditing = null;
    embOutilWireframe = null;
    render();
  };
  document.getElementById('eo-cancel').onclick = ()=>{ embOutilEditing = null; embOutilWireframe = null; render(); };

  if(embOutilWireframe){ attachDxfZoomPan('step-viewer'); }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
