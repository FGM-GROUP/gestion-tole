  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);}
  body{display:flex;min-height:100vh;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* Ruler signature strip */
  #ruler{
    width:18px;flex:0 0 18px;height:100vh;position:sticky;top:0;
    background:
      repeating-linear-gradient(to bottom,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 10px),
      repeating-linear-gradient(to bottom,
        var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 50px);
    background-size: 6px 10px, 12px 50px;
    background-position: right, right;
    background-repeat: repeat-y;
    border-right:1px solid var(--line);
    opacity:.75;
  }

  #sidebar{
    width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.5px;line-height:1.15;color:var(--ink);}
  .brand span{color:var(--accent);}
  .app-version{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.5px;margin-top:4px;}
  .brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:1px;margin-top:6px;text-transform:uppercase;}
  nav{margin-top:34px;display:flex;flex-direction:column;gap:4px;}
  .nav-btn{
    font-family:var(--display);font-size:14px;letter-spacing:.5px;text-transform:uppercase;
    text-align:left;background:none;border:none;color:var(--ink-dim);padding:11px 10px;border-radius:var(--radius);
    cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;
  }
  .nav-group{margin-top:22px;}
  .nav-group:first-child{margin-top:0;}
  .nav-group-title{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);opacity:.6;padding:0 10px 4px;}
  .nav-btn .num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .nav-btn:hover{color:var(--ink);background:var(--panel-2);}
  .nav-btn.active{color:var(--ink);background:var(--panel-2);border-left-color:var(--accent);}
  .nav-btn.active .num{color:var(--accent);}
  .sidebar-foot{margin-top:auto;font-family:var(--mono);font-size:10px;color:var(--ink-dim);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;}

  main{flex:1;padding:36px 44px;max-width:1180px;}
  header.page{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
  h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0;letter-spacing:.3px;}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
  .lede{color:var(--ink-dim);font-size:13.5px;margin-top:6px;max-width:520px;}

  button{font-family:var(--body);cursor:pointer;}
  .btn{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:var(--radius);
    font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{border-color:var(--ink-dim);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
  .btn.danger:hover{background:var(--danger-bg);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim);padding:6px 8px;}
  .btn.ghost:hover{color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  input[type=text],input[type=number],select,textarea{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:var(--radius);
    font-family:var(--body);font-size:13px;
  }
  input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .search{min-width:220px;}
  label{font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    color:var(--ink-dim);border-bottom:1px solid var(--line);padding:0 12px 10px;font-weight:500;
  }
  tbody td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--panel-2);}
  .ref{font-family:var(--mono);font-weight:600;letter-spacing:.3px;}
  .dim{font-family:var(--mono);color:var(--ink-dim);font-size:12.5px;}
  .zone-pill{
    font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px;color:var(--blue);white-space:nowrap;
  }
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:24px;height:24px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .qty-ctrl button:hover{border-color:var(--accent);color:var(--accent);}
  .qty-val{font-family:var(--mono);min-width:24px;text-align:center;font-weight:600;}
  .qty-low .qty-val{color:var(--danger);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .attach-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;}
  .attach-badge.filled{background:var(--accent);color:#1a1a1a;cursor:pointer;border:none;}
  .attach-badge.filled:hover{filter:brightness(1.1);}
  .attach-badge.empty{background:transparent;border:1px dashed var(--line);color:var(--ink-dim);}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:46px 24px;text-align:center;color:var(--ink-dim);
  }
  .empty b{color:var(--ink);display:block;font-family:var(--display);font-size:16px;margin-bottom:6px;font-weight:500;}

  /* Zones grid — hazard tag style */
  .zones-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .tag{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .tag-stripe{
    height:8px;width:100%;
    background:repeating-linear-gradient(-45deg,var(--accent),var(--accent) 8px,#1a1a1a 8px,#1a1a1a 16px);
  }
  .tag-body{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .tag-code{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:1px;}
  .tag-name{color:var(--ink-dim);font-size:13px;margin-top:-6px;}
  .tag-count{font-size:11.5px;color:var(--ink-dim);font-family:var(--mono);}
  .tag-qr{display:flex;justify-content:center;padding:6px;background:#fff;border-radius:2px;width:fit-content;}
  .tag-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}

  /* Scanner viewfinder */
  .scanner-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
  .viewfinder{
    position:relative;width:340px;height:340px;background:#000;border-radius:var(--radius);overflow:hidden;
    flex:0 0 auto;
  }
  .viewfinder video{width:100%;height:100%;object-fit:cover;display:block;}
  .viewfinder .corner{position:absolute;width:28px;height:28px;border:3px solid var(--accent);}
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}
  .viewfinder .idle{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    color:var(--ink-dim);font-size:13px;text-align:center;padding:20px;
  }
  .scan-line{position:absolute;left:14px;right:14px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);top:50%;animation:scanmove 2.2s ease-in-out infinite;}
  @keyframes scanmove{0%{top:16%;}50%{top:84%;}100%{top:16%;}}
  .scan-panel{flex:1;min-width:280px;}
  .result-card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}

  .dxf-viewer{position:relative;overflow:hidden;background:#fff;touch-action:none;user-select:none;}
  .dxf-viewer svg{display:block;transform-origin:0 0;cursor:grab;}
  .dxf-viewer.dragging svg{cursor:grabbing;}
  .dxf-viewer-controls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:2;}
  .dxf-viewer-controls button{
    width:28px;height:28px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .dxf-viewer-controls button:hover{border-color:var(--accent);color:var(--accent);}
  .dxf-viewer-hint{position:absolute;bottom:6px;left:8px;font-size:10.5px;color:#9aa2a9;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:4px;z-index:2;}
  .result-card.found{border-color:var(--ok);}
  .result-card.notfound{border-color:var(--danger);}
  .manual-scan{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .manual-scan .row{display:flex;gap:8px;margin-top:8px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:520px;padding:26px 28px;}
  .modal h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;margin-bottom:14px;}
  .field input,.field select,.field textarea{width:100%;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .banner{
    background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--radius);
    padding:10px 14px;font-size:12.5px;color:var(--ink-dim);margin-bottom:20px;
  }
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--radius);
    font-size:13px;font-weight:500;z-index:100;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  #print-area{display:none;}
  @media print{
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    @page{ size: A4 landscape; margin: 10mm; }
    html, body{ background:#fff !important; }
    body > *{ display:none !important; }
    #print-area{
      display:flex !important;flex-direction:column;align-items:center;padding-top:6mm;
      width:100%;height:95mm;box-sizing:border-box;border-bottom:1.5px dashed #999;margin:0;
      overflow:hidden;
    }
    .print-tag{
      border:3px solid #000;padding:8mm 12mm;width:100%;max-width:150mm;max-height:82mm;box-sizing:border-box;font-family:var(--mono);overflow:hidden;
    }
    .print-tag .pcode{font-size:26px;font-weight:700;margin-bottom:4px;line-height:1.1;word-break:break-word;}
    .print-tag .pname{font-size:13px;margin-bottom:8px;color:#333;}
    .print-tag table{font-size:12px !important;}
    .print-tag table td{padding:3px 0 !important;}
    .rack-print{width:100%;height:100%;display:flex;justify-content:center;}
    .rack-strip{
      width:100%;max-width:230mm;height:100%;border:2.5px solid #000;border-radius:4mm;overflow:hidden;
      font-family:var(--mono);display:flex;flex-direction:column;box-sizing:border-box;
    }
    .rack-strip-title{
      background:#fff;color:#000;text-align:center;font-weight:800;font-size:20px;
      padding:2.5mm 2mm;border-bottom:2.5px solid #000;letter-spacing:1px;flex:0 0 auto;
    }
    .rack-strip-row{display:grid;flex:1;min-height:0;}
    .rack-strip-shelf{
      padding:2.5mm 2mm 2mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      border-right:1.5px solid #000;height:100%;box-sizing:border-box;overflow:hidden;
    }
    .rack-strip-shelf:last-child{border-right:none;}
    .rack-strip-band{display:flex;justify-content:center;align-items:center;margin-bottom:1mm;}
    .rack-strip-band .letter{font-size:18px;font-weight:800;color:#111;}
    .rack-strip-name{font-size:7.5px;font-weight:600;color:#222;margin:0.5mm 0 2mm;text-align:center;line-height:1.2;}
    .rack-strip-qr-pill{background:#fff;border-radius:4mm;padding:1.5mm;display:flex;justify-content:center;}
  }

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  .table-wrap table{min-width:640px;}
  #main-view .table-wrap{width:100%;}

  @media (max-width:820px){
    #ruler{display:none;}
    body{flex-direction:column;}
    #sidebar{
      width:100%;flex:none;height:auto;position:sticky;top:0;z-index:40;
      flex-direction:row;align-items:center;padding:12px 14px;gap:8px;
    }
    .brand{font-size:17px;}
    .brand-sub{display:none;}
    nav{margin-top:0;flex-direction:row;margin-left:auto;gap:2px;}
    .nav-btn{padding:8px;font-size:0;gap:0;border-left:none;border-bottom:3px solid transparent;}
    .nav-btn.active{border-left-color:transparent;border-bottom-color:var(--accent);}
    .nav-btn .num{font-size:13px;}
    .sidebar-foot{display:none;}
    main{padding:18px 14px 90px;}
    header.page{flex-direction:column;align-items:stretch;gap:14px;}
    header.page .btn.primary{width:100%;justify-content:center;}
    h1{font-size:22px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar > *{width:100%;}
    .grid2,.grid3{grid-template-columns:1fr;}
    .overlay{padding:0;align-items:flex-end;}
    .modal{max-width:100%;border-radius:var(--radius) var(--radius) 0 0;max-height:92vh;overflow-y:auto;}
    .zones-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
    .scanner-wrap{flex-direction:column;align-items:stretch;}
    .viewfinder{width:100%;max-width:420px;height:auto;aspect-ratio:1/1;margin:0 auto;}
    .row-actions{flex-wrap:wrap;justify-content:flex-start;}
  }

  @media (max-width:420px){
    .nav-btn .num{font-size:12px;}
    h1{font-size:19px;}
    .tag-code{font-size:18px;}
  }

  a{color:var(--blue);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* Auth gate */
  .auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .auth-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:360px;padding:30px 28px;}
  .auth-brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;margin-bottom:2px;}
  .auth-brand span{color:var(--accent);}
  .auth-sub{color:var(--ink-dim);font-size:12px;margin-bottom:22px;}
  .auth-error{color:var(--danger);font-size:12px;margin:-6px 0 12px;}
  .auth-switch{font-size:12px;color:var(--ink-dim);margin-top:16px;text-align:center;}
  .auth-switch a{cursor:pointer;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-dim);}
  .user-chip button{background:none;border:none;color:var(--ink-dim);text-decoration:underline;cursor:pointer;font-size:11px;padding:0;}
  .user-chip button:hover{color:var(--ink);}

  .install-banner{position:fixed;top:0;left:0;right:0;z-index:250;background:var(--panel-2);border-bottom:1px solid var(--line);color:var(--ink);font-size:12.5px;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .install-banner button.close-x{background:none;border:none;color:var(--ink-dim);font-size:18px;cursor:pointer;line-height:1;}
  .install-banner button.close-x:hover{color:var(--ink);}
  body:has(#install-banner[style*="flex"]) .auth-gate{padding-top:52px;}
</style>
</head>
<body>

<div id="auth-gate" class="auth-gate" style="display:none"></div>
<div id="install-banner" style="display:none"></div>

<div id="ruler" aria-hidden="true" style="display:none"></div>

<div id="sidebar" style="display:none">
  <div class="brand">TÔLE<span>RIE</span></div>
  <div class="brand-sub">Gestion de stock</div>
  <div class="app-version" id="app-version-side"></div>
  <nav>
    <div class="nav-group">
      <div class="nav-group-title">Rangement tôlerie</div>
      <button class="nav-btn active" data-tab="inventaire"><span class="num">01</span> Inventaire</button>
      <button class="nav-btn" data-tab="zones"><span class="num">02</span> Zones</button>
      <button class="nav-btn" data-tab="scanner"><span class="num">03</span> Scanner QR</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Laser — simulation &amp; imbrication</div>
      <button class="nav-btn" data-tab="decoupelaser"><span class="num">04</span> Découpe laser</button>
      <button class="nav-btn" data-tab="devstep"><span class="num">04b</span> Développé du STEP</button>
      <button class="nav-btn" data-tab="laserhist"><span class="num">05</span> Suivi des découpes</button>
      <button class="nav-btn" data-tab="imbrication"><span class="num">06</span> Imbrication</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Emboutissage</div>
      <button class="nav-btn" data-tab="embpiece"><span class="num">07</span> Pièce</button>
      <button class="nav-btn" data-tab="taboutil"><span class="num">08</span> Outillage</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Cintrage</div>
      <button class="nav-btn" data-tab="cintrage"><span class="num">09</span> Tube cintré (STEP)</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Aéronautique</div>
      <button class="nav-btn" data-tab="aero"><span class="num">10</span> Tôlerie aéronautique</button>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Réglages</div>
      <button class="nav-btn" data-tab="parametres"><span class="num">10</span> Paramètres</button>
    </div>
  </nav>
  <div class="sidebar-foot" id="sidebar-foot"><span class="dot"></span>Connexion…</div>
</div>

<main id="main-view" style="display:none">
  <div id="view"></div>
</main>

<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------
   DATA LAYER
--------------------------------------------------------- */
let toles = [];
let zones = [];
let embPieces = [];
let embOutils = [];
/* Matières — prix au kilo et densité centralisés (onglet Paramètres), utilisés par Pièce, Outillage et le devis de découpe laser.
   densite en kg/dm³ ; outillage:true = matière d'outillage (exclue des listes de matières à découper). */
const DEFAULT_MATIERES = [
  { nom:'Acier', densite:8, prixKg:3 },
  { nom:'Alu', densite:2.7, prixKg:5 },
  { nom:'Inox', densite:8, prixKg:6 },
  { nom:'42CMD8', densite:7.85, prixKg:4, outillage:true },
];
let settings = { paletteStart: 1, defaultLongueur: 1000, defaultLargeur: 1000, defaultEpaisseur: 1, defaultMatiere: 'Acier', defaultSeuil: 1,
  matieres: DEFAULT_MATIERES.map(m=>Object.assign({}, m)) };

function getMatieres(){
  return (settings.matieres && settings.matieres.length) ? settings.matieres : DEFAULT_MATIERES;
}
/* Cherche une matière par nom (insensible à la casse ; « Aluminium » = « Alu »), sinon la première matière à découper. */
function getMatiere(nom){
  const list = getMatieres();
  const n = String(nom||'').trim().toLowerCase();
  const key = n === 'aluminium' ? 'alu' : n;
  return list.find(m=> String(m.nom).trim().toLowerCase() === key)
      || list.find(m=> !m.outillage)
      || DEFAULT_MATIERES[0];
}
let currentTab = 'inventaire';

/* Version affichée dans l'application (majeure.mineure) — à incrémenter à chaque livraison :

function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* Référence automatique : MATIÈRE-NUANCE-ÉPAISSEURxLONGUEURxLARGEUR-SÉQUENCE */
const MATIERE_CODES = {
  'Acier':'AC', 'Acier galvanisé':'GA', 'Inox':'IX', 'Aluminium':'AL', 'Cuivre':'CU', 'Autre':'XX'
};
function slugPart(str){
  return String(str||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]+/g,'').slice(0,12);
}
function buildRefBase(matiere, nuance, epaisseur, longueur, largeur){
  const parts = [MATIERE_CODES[matiere] || 'XX'];
  const n = slugPart(nuance);
  if(n) parts.push(n);
  const ep = String(epaisseur).replace('.', ',');
  parts.push(`${ep}X${longueur}X${largeur}`);
  return parts.join('-');
}
function generateRef(matiere, nuance, epaisseur, longueur, largeur, excludeId){
  const base = buildRefBase(matiere, nuance, epaisseur, longueur, largeur);
  const nums = toles
    .filter(t => t.id !== excludeId && t.ref && t.ref.startsWith(base + '-'))
    .map(t => { const m = t.ref.match(/-(\d{3,})$/); return m ? parseInt(m[1], 10) : 0; });
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `${base}-${String(next).padStart(3,'0')}`;
}

async function loadData(){

    const checkDone = ()=>{ done++; if(done>=TOTAL) resolve(); };

    unsubToles = db.collection('toles').onSnapshot(snap=>{
      toles = snap.docs.map(d=>{
        const data = d.data();
        return {
          id: uid(), _fbId: d.id,
          ref: data.ref || '', matiere: data.matiere || 'Acier', nuance: data.nuance || '',
          epaisseur: Number(data.epaisseur) || 0, longueur: Number(data.longueur) || 0, largeur: Number(data.largeur) || 0,
          qte: Number(data.qte) || 0, seuil: Number(data.seuil) || 0, zone: data.zone || '', palette: data.palette || '',
          secteur: data.secteur || 'Autre',
          attachment: data.attachment || null,
          dateCreation: data.dateCreation || null, dateModification: data.dateModification || null
        };
      });
      serverIdSnapshots.toles = new Set(toles.map(t=>t._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); toles = []; toast('Impossible de charger le stock depuis Firebase'); checkDone(); });

    unsubZones = db.collection('zones').onSnapshot(snap=>{
      zones = snap.docs.map(d=>({ code: d.id, nom: d.data().nom || d.id }));

      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); zones = []; toast('Impossible de charger les zones depuis Firebase'); checkDone(); });

    unsubSettings = db.collection('config').doc('settings').onSnapshot(sdoc=>{
      if(sdoc.exists){
        const d = sdoc.data();
        settings = {
          paletteStart: Number(d.paletteStart) || 1,

          defaultEpaisseur: Number(d.defaultEpaisseur) || 1,

          matieres: (Array.isArray(d.matieres) && d.matieres.length)
            ? d.matieres.map(m=>({ nom: String(m.nom||''), densite: Number(m.densite)||0, prixKg: Number(m.prixKg)||0, outillage: !!m.outillage }))
            : DEFAULT_MATIERES.map(m=>Object.assign({}, m)),
        };
      }
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); checkDone(); });

    unsubEmbPieces = db.collection('embPieces').onSnapshot(snap=>{
      embPieces = snap.docs.map(d=> Object.assign(defaultEmbPiece(), d.data(), { id: uid(), _fbId: d.id }));
      serverIdSnapshots.embPieces = new Set(embPieces.map(p=>p._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); embPieces = []; checkDone(); });

    unsubEmbOutils = db.collection('embOutils').onSnapshot(snap=>{
      embOutils = snap.docs.map(d=> Object.assign(defaultEmbOutil(), d.data(), { id: uid(), _fbId: d.id }));
      serverIdSnapshots.embOutils = new Set(embOutils.map(o=>o._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); embOutils = []; checkDone(); });

    unsubLaserHist = db.collection('laserHistorique').onSnapshot(snap=>{
      laserHist = snap.docs.map(d=> Object.assign({}, d.data(), { _fbId: d.id }))

async function saveEmbPieces(){

    const currentIds = new Set(embPieces.filter(p=>p._fbId).map(p=>p._fbId));
    const removed = [...(serverIdSnapshots.embPieces || new Set())].filter(id=>!currentIds.has(id));
    for(const id of removed){ await db.collection('embPieces').doc(id).delete(); }
    for(const p of embPieces){
      const fields = Object.assign({}, p);
      delete fields.id; delete fields._fbId;
      fields.dateModification = new Date().toISOString();
      if(p._fbId){ await db.collection('embPieces').doc(p._fbId).set(fields); }
      else{ const ref = await db.collection('embPieces').add(fields); p._fbId = ref.id; }
    }
    serverIdSnapshots.embPieces = new Set(embPieces.filter(p=>p._fbId).map(p=>p._fbId));
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

async function saveToles(){

      if(t._fbId){

/* Fenêtre de confirmation intégrée à l'application (remplace confirm() du navigateur,
   que certains navigateurs bloquent après plusieurs affichages, ce qui empêchait de supprimer). */
function askConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = 300;
    overlay.style.alignItems = 'center';
    overlay.innerHTML = `
      <div class="modal" style="max-width:440px;" role="alertdialog" aria-modal="true">
        <h2 style="color:var(--danger);">${escapeHtml(opts.title || 'Confirmer la suppression')}</h2>
        <div style="font-size:14px;line-height:1.5;margin-bottom:6px;">${message}</div>
        ${opts.warning===false ? '' : '<div style="font-size:12.5px;color:var(--ink-dim);margin-top:10px;">Cette action est définitive et ne peut pas être annulée.</div>'}
        <div class="modal-actions">
          <button class="btn ghost" id="ac-cancel">Annuler</button>
          <button class="btn danger" id="ac-ok">${escapeHtml(opts.confirmLabel || 'Supprimer définitivement')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = (val)=>{ document.removeEventListener('keydown', onKey); overlay.remove(); resolve(val); };
    const onKey = (e)=>{ if(e.key==='Escape') close(false); };
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(false); });
    overlay.querySelector('#ac-cancel').onclick = ()=> close(false);
    overlay.querySelector('#ac-ok').onclick = ()=> close(true);
    overlay.querySelector('#ac-cancel').focus();
  });
}

  });
  view.querySelectorAll('[data-view-attach]').forEach(b=>{

  view.querySelectorAll('[data-del]').forEach(b=>{

    };
  });
}

function compressImageFile(file, maxDim=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Image illisible'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

}

function openToleModal(existing, prefillZone){

  const t = existing || { id: uid(), ref:'', matiere: settings.defaultMatiere || 'Acier', nuance:'', epaisseur: settings.defaultEpaisseur ?? 1, longueur: settings.defaultLongueur ?? 1000, largeur: settings.defaultLargeur ?? 1000, qte:1, seuil: settings.defaultSeuil ?? 1, zone: prefillZone || '', palette:'', secteur:'Autre', attachment: null };

  const excludeId = editing ? t.id : null;
  const usedByOthers = [...new Set(toles.filter(x=>x.id!==excludeId && x.palette).map(x=>parseInt(x.palette,10)).filter(n=>!isNaN(n)))].sort((a,b)=>a-b);
  let nextFree = settings.paletteStart || 1; while(usedByOthers.includes(nextFree)) nextFree++;
  const currentNum = (t.palette !== '' && t.palette !== undefined && t.palette !== null) ? parseInt(t.palette,10) : null;
  const paletteNums = new Set(usedByOthers);
  paletteNums.add(nextFree);
  if(currentNum !== null) paletteNums.add(currentNum);
  const sortedPaletteNums = [...paletteNums].sort((a,b)=>a-b);
  const paletteOptionsHtml = `<option value="" ${currentNum===null?'selected':''}>— Aucune —</option>` +
    sortedPaletteNums.map(n=>{
      const label = n===nextFree ? `+ Nouvelle palette (n°${n})` : `Palette n°${n}`;
      return `<option value="${n}" ${currentNum===n?'selected':''}>${label}</option>`;
    }).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${editing ? 'Modifier la tôle' : 'Ajouter une tôle'}</h2>
      <div class="field">
        <label>Référence <span style="text-transform:none;letter-spacing:0;color:var(--ink-dim);font-weight:400;">(générée automatiquement — modifiable)</span></label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="f-ref" value="${escapeHtml(t.ref)}" style="flex:1">
          <button type="button" class="btn small" id="regen-ref" title="Régénérer à partir de la nuance, l'épaisseur et les dimensions">↻ Régénérer</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>Matière</label>
          <select id="f-matiere">
            ${['Acier','Acier galvanisé','Inox','Aluminium','Cuivre','Autre'].map(m=>`<option ${t.matiere===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Épaisseur (mm)</label><input type="number" step="0.1" id="f-ep" value="${t.epaisseur}"></div>
      </div>
      <div class="field"><label>Nuance</label><input type="text" id="f-nuance" value="${escapeHtml(t.nuance||'')}" placeholder="Ex. S235JR, DX51D, 5754, 304L…"></div>
      <div class="field"><label>Secteur</label><select id="f-secteur">${['Aéronautique','Autre'].map(s=>`<option ${((t.secteur||'Autre')===s)?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field">
        <label>Photo / fichier joint <span style="text-transform:none;letter-spacing:0;color:var(--ink-dim);font-weight:400;">(certificat matière, photo de la tôle…)</span></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn ghost small" id="btn-take-photo">📷 Prendre une photo</button>
          <button type="button" class="btn ghost small" id="btn-choose-file">📎 Choisir un fichier</button>
          <input type="file" id="f-photo-capture" accept="image/*" capture="environment" style="display:none;">
          <input type="file" id="f-file-attach" style="display:none;">
        </div>
        <div id="attach-preview" style="margin-top:10px;"></div>
      </div>
      <div class="field"><label>N° de palette <span style="text-transform:none;letter-spacing:0;color:var(--ink-dim);font-weight:400;">(automatique — se libère quand plus aucune tôle ne l'utilise)</span></label><select id="f-palette">${paletteOptionsHtml}</select></div>
      <div class="grid2">

        <div class="field"><label>Largeur (mm)</label><input type="number" id="f-larg" value="${t.largeur}"></div>

        <select id="f-zone">
          <option value="">— Non affectée —</option>
          ${zones.map(z=>`<option value="${z.code}" ${t.zone===z.code?'selected':''}>${z.code} — ${escapeHtml(z.nom)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-modal">Annuler</button>
        <button class="btn primary" id="save-tole">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancel-modal').onclick = ()=> overlay.remove();

  const refInput = overlay.querySelector('#f-ref');
  const matiereSel = overlay.querySelector('#f-matiere');
  const nuanceInput = overlay.querySelector('#f-nuance');
  const epInput = overlay.querySelector('#f-ep');
  const longInput = overlay.querySelector('#f-long');
  const largInput = overlay.querySelector('#f-larg');
  let refManuallyEdited = editing && !!t.ref;

  function recomputeRef(){
    if(refManuallyEdited) return;
    refInput.value = generateRef(
      matiereSel.value, nuanceInput.value,
      parseFloat(epInput.value) || 0,
      parseInt(longInput.value) || 0,
      parseInt(largInput.value) || 0,
      editing ? t.id : null
    );
  }
  [matiereSel, nuanceInput, epInput, longInput, largInput].forEach(el=>{
    el.addEventListener('input', recomputeRef);
  });

    const isImg = attachment.type && attachment.type.startsWith('image/');

          ? `<img src="${attachment.dataUrl}" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);">`
          : `<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:var(--radius);border:1px solid var(--line);font-size:20px;">📄</div>`}
        <div style="flex:1;font-size:12px;color:var(--ink-dim);word-break:break-all;">${escapeHtml(attachment.name)}</div>

      </div>`;
    el.querySelector('#btn-remove-attach').onclick = ()=>{ attachment = null; renderAttachPreview(); };
  }
  renderAttachPreview();

  overlay.querySelector('#btn-take-photo').onclick = ()=> overlay.querySelector('#f-photo-capture').click();
  overlay.querySelector('#btn-choose-file').onclick = ()=> overlay.querySelector('#f-file-attach').click();

  overlay.querySelector('#f-photo-capture').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImageFile(file);
      if(dataUrl.length > 700000){ toast('Photo trop volumineuse même compressée — réessaie.'); return; }
      attachment = { name: file.name || 'photo.jpg', type: 'image/jpeg', dataUrl };
      renderAttachPreview();
    }catch(err){ console.error(err); toast('Impossible de traiter la photo'); }
    e.target.value = '';
  };

  overlay.querySelector('#f-file-attach').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      let dataUrl;
      if(file.type && file.type.startsWith('image/')){
        dataUrl = await compressImageFile(file);
      }else{
        dataUrl = await readFileAsDataUrl(file);
      }
      if(dataUrl.length > 700000){ toast('Fichier trop volumineux (limite ~500 Ko) — choisis un fichier plus léger.'); return; }
      attachment = { name: file.name, type: file.type || 'application/octet-stream', dataUrl };
      renderAttachPreview();
    }catch(err){ console.error(err); toast('Impossible de lire ce fichier'); }
    e.target.value = '';
  };

  overlay.querySelector('#save-tole').onclick = async ()=>{

    if(!ref){ toast('La référence est requise'); return; }
    t.ref = ref;

    t.nuance = overlay.querySelector('#f-nuance').value.trim();
    t.secteur = overlay.querySelector('#f-secteur').value;
    t.palette = overlay.querySelector('#f-palette').value.trim();
    t.epaisseur = parseFloat(overlay.querySelector('#f-ep').value) || 0;
    t.longueur = parseInt(overlay.querySelector('#f-long').value) || 0;
    t.largeur = parseInt(overlay.querySelector('#f-larg').value) || 0;
    t.qte = parseInt(overlay.querySelector('#f-qte').value) || 0;
    t.seuil = parseInt(overlay.querySelector('#f-seuil').value) || 0;
    t.zone = overlay.querySelector('#f-zone').value;
    t.attachment = attachment;
    const now = new Date().toISOString();
    if(!editing){
      t.dateCreation = now;
      t.dateModification = now;
      toles.push(t);
    }else{
      t.dateModification = now;
    }
    await saveToles();
    overlay.remove();
    toast(editing ? 'Tôle mise à jour' : 'Tôle ajoutée');
    render();
  };
}

function deriveRack(code){
  const m = String(code||'').match(/^[^\d]+/);
  return (m ? m[0] : code).replace(/[-_\s]+$/,'') || code;
}

function renderZones(){
  const view = document.getElementById('view');
  const racks = [...new Set(zones.map(z=>deriveRack(z.code)))].sort();

  view.innerHTML = `

                <button class="btn small" data-view-zone="${z.code}">Voir contenu</button>

    b.onclick = ()=>{
      invZoneFilter = b.dataset.viewZone;

      document.querySelector('[data-tab="inventaire"]').classList.add('active');
      renderInventaire();

  view.querySelectorAll('[data-del-zone]').forEach(b=>{

function openZoneModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Créer une zone de rangement</h2>
      <div class="lede" style="margin:-8px 0 18px;">Renseignez soit Rack + Étagère (emplacement standard), soit "Autre" (emplacement particulier).</div>
      <div class="grid2">
        <div class="field"><label>Rack</label><input type="text" id="z-rack" placeholder="Ex. A"></div>
        <div class="field"><label>Étagère</label><input type="text" id="z-etagere" placeholder="Ex. 1"></div>
      </div>
      <div class="field"><label>Autre (emplacement hors rack)</label><input type="text" id="z-autre" placeholder="Ex. Chutes, Extérieur, Zone réception…"></div>
      <div class="banner" id="z-preview">Le code de zone sera généré automatiquement.</div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancel-z">Annuler</button>
        <button class="btn primary" id="save-z">Créer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#cancel-z').onclick = ()=> overlay.remove();

  const rackInput = overlay.querySelector('#z-rack');
  const etagereInput = overlay.querySelector('#z-etagere');
  const autreInput = overlay.querySelector('#z-autre');
  const preview = overlay.querySelector('#z-preview');

  function computeZone(){
    const rack = rackInput.value.trim().toUpperCase();
    const etagere = etagereInput.value.trim();
    const autre = autreInput.value.trim();
    if(autre){
      return { code: slugPart(autre), nom: autre };
    }
    if(rack && etagere){
      return { code: rack + etagere, nom: `Rack ${rack} — Étagère ${etagere}` };
    }
    if(rack){
      return { code: rack, nom: `Rack ${rack}` };
    }
    return null;
  }
  function updatePreview(){
    const z = computeZone();
    preview.textContent = z ? `Code généré : ${z.code}  —  ${z.nom}` : 'Renseignez au moins Rack, ou Autre.';
  }
  [rackInput, etagereInput, autreInput].forEach(el=> el.addEventListener('input', updatePreview));

  overlay.querySelector('#save-z').onclick = async ()=>{
    const z = computeZone();
    if(!z){ toast('Renseignez au moins Rack, ou Autre'); return; }
    if(zones.some(x=>x.code===z.code)){ toast('Ce code de zone existe déjà'); return; }
    zones.push(z);
    await saveZones();
    overlay.remove();
    toast('Zone créée');
    renderZones();
  };
}

const RACK_STRIP_COLORS = ['#9ACD32', '#E5433B', '#9FC5E8', '#FDD835', '#4FB3A9', '#B388DB', '#FF9E6D', '#90A4AE'];

function setPrintOrientation(orientation){
  let style = document.getElementById('dynamic-page-style');
  if(!style){
    style = document.createElement('style');
    style.id = 'dynamic-page-style';
    document.head.appendChild(style);
  }
  style.textContent = `@media print { @page { size: A4 ${orientation}; margin: 10mm; } }`;
}

function printRackTag(rackName){
  const shelves = zones.filter(z=>deriveRack(z.code) === rackName)
    .sort((a,b)=> a.code.localeCompare(b.code, undefined, { numeric:true }));
  if(shelves.length === 0) return;

  setPrintOrientation('landscape');

  const area = document.getElementById('print-area');
  area.className = '';
  area.innerHTML = `
    <div class="rack-print">
      <div class="rack-strip">
        <div class="rack-strip-title">Rack ${escapeHtml(rackName)}</div>
        <div class="rack-strip-row" style="grid-template-columns: repeat(${shelves.length}, 1fr);">
        ${shelves.map((z, i)=>{
          const color = RACK_STRIP_COLORS[i % RACK_STRIP_COLORS.length];
          const offset = (i % 2 === 1) ? 'padding-top:14mm;' : '';
          return `
          <div class="rack-strip-shelf" style="background:${color};${offset}">
            <div class="rack-strip-band">
              <div class="letter">${escapeHtml(z.code)}</div>
            </div>
            <div class="rack-strip-name">${escapeHtml(z.nom)}</div>
            <div class="rack-strip-qr-pill" id="rack-qr-${z.code}"></div>
          </div>`;
        }).join('')}

let nestSheet = { longueur: 2000, largeur: 1000 };
let nestGap = 5;
let nestParts = []; // { id, nom, longueur, largeur, qte, source }

function parseDxfBoundingBox(text){
  const parser = new DxfParser();
  const dxf = parser.parseSync(text);
  // Contour réel de la pièce (gravures et grands arcs exclus) quand il est exploitable
  try{
    const na = laserNetArea(dxf.entities||[]);
    if(na && na.bb) return { longueur: Math.round(na.bb.maxX-na.bb.minX), largeur: Math.round(na.bb.maxY-na.bb.minY) };
  }catch(err){ console.warn('Contour DXF non exploitable, repli sur la boîte englobante', err); }
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  function pt(x,y){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  (dxf.entities||[]).forEach(e=>{
    if(e.vertices){ e.vertices.forEach(v=>pt(v.x,v.y)); }
    if(e.startPoint) pt(e.startPoint.x, e.startPoint.y);
    if(e.endPoint) pt(e.endPoint.x, e.endPoint.y);
    if(e.center && e.radius!=null){ pt(e.center.x-e.radius, e.center.y-e.radius); pt(e.center.x+e.radius, e.center.y+e.radius); }
    if(e.position) pt(e.position.x, e.position.y);
  });
  if(!isFinite(minX)) throw new Error('Aucune géométrie exploitable trouvée dans le DXF.');
  return { longueur: Math.round(maxX-minX), largeur: Math.round(maxY-minY) };
}

/* Table de tous les CARTESIAN_POINT du fichier STEP, indexée par identifiant #id.
   Partagée par les deux lecteurs STEP approximatifs de l'application. */
function stepCartesianPoints(text){
  const re = /#(\d+)\s*=\s*CARTESIAN_POINT\s*\(\s*'[^']*'\s*,\s*\(([^)]+)\)\s*\)/g;
  const pts = {};
  let m;
  while((m = re.exec(text))){
    const vals = m[2].split(',').map(s=>parseFloat(s.trim()));
    if(vals.length>=2 && vals.every(isFinite)) pts[m[1]] = vals;
  }
  return pts;
}

function parseStepBoundingBoxApprox(text){
  const pts = stepCartesianPoints(text);
  // On ne garde que les points réellement utilisés comme sommets de la pièce (VERTEX_POINT) :
  // les CARTESIAN_POINT bruts incluent aussi les origines de repères (AXIS2_PLACEMENT_3D) et les
  // points de construction des courbes, qui faussent complètement la boîte englobante (souvent
  // un point à l'origine (0,0,0) du repère global, très loin de la pièce elle-même).
  const vertexRe = /VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m, minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity, found=0;
  while((m = vertexRe.exec(text))){
    const v = pts[m[1]];
    if(!v) continue;
    found++;
    if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
    if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
  }
  if(!found){
    Object.values(pts).forEach(v=>{
      if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
      if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
    });
  }
  if(!isFinite(minX)) throw new Error('Aucun point exploitable trouvé dans le fichier STEP.');
  return { longueur: Math.round(maxX-minX), largeur: Math.round(maxY-minY) };
}

/* Algorithme MaxRects (Maximal Rectangles, Best-Short-Side-Fit) avec rotation 90°,
   nettement plus performant qu'un simple rangement par rangées. */
function packMaxRects(sheetL, sheetW, units, gap){
  let freeRects = [{x:0, y:0, w:sheetL, h:sheetW}];
  const placed = [];
  const unplaced = [];

  function isContainedIn(a,b){
    return a.x>=b.x && a.y>=b.y && a.x+a.w<=b.x+b.w && a.y+a.h<=b.y+b.h;
  }
  function pruneFreeList(){
    for(let i=0;i<freeRects.length;i++){
      for(let j=i+1;j<freeRects.length;j++){
        if(isContainedIn(freeRects[i], freeRects[j])){ freeRects.splice(i,1); i--; break; }
        if(isContainedIn(freeRects[j], freeRects[i])){ freeRects.splice(j,1); j--; }
      }
    }
  }
  function splitFreeNode(fr, used){
    if(used.x >= fr.x+fr.w || used.x+used.w <= fr.x || used.y >= fr.y+fr.h || used.y+used.h <= fr.y) return null;
    const out = [];
    if(used.x > fr.x) out.push({x:fr.x, y:fr.y, w:used.x-fr.x, h:fr.h});
    if(used.x+used.w < fr.x+fr.w) out.push({x:used.x+used.w, y:fr.y, w:fr.x+fr.w-(used.x+used.w), h:fr.h});
    if(used.y > fr.y) out.push({x:fr.x, y:fr.y, w:fr.w, h:used.y-fr.y});
    if(used.y+used.h < fr.y+fr.h) out.push({x:fr.x, y:used.y+used.h, w:fr.w, h:fr.y+fr.h-(used.y+used.h)});
    return out;
  }
  function findPosition(w, h){
    let bestShort=Infinity, bestLong=Infinity, best=null, bestRotated=false;
    freeRects.forEach(fr=>{
      if(fr.w >= w && fr.h >= h){
        const sf = Math.min(fr.w-w, fr.h-h), lf = Math.max(fr.w-w, fr.h-h);
        if(sf < bestShort || (sf===bestShort && lf<bestLong)){ bestShort=sf; bestLong=lf; best={x:fr.x,y:fr.y,w,h}; bestRotated=false; }
      }
      if(fr.w >= h && fr.h >= w){
        const sf = Math.min(fr.w-h, fr.h-w), lf = Math.max(fr.w-h, fr.h-w);
        if(sf < bestShort || (sf===bestShort && lf<bestLong)){ bestShort=sf; bestLong=lf; best={x:fr.x,y:fr.y,w:h,h:w}; bestRotated=true; }
      }
    });
    return best ? {rect:best, rotated:bestRotated} : null;
  }

  units.forEach(u=>{
    const gw = u.w + gap, gh = u.h + gap;
    const found = findPosition(gw, gh);
    if(!found){ unplaced.push(u); return; }
    const node = found.rect;
    placed.push({ nom:u.nom, x:node.x, y:node.y, w: found.rotated ? u.h : u.w, h: found.rotated ? u.w : u.h, rotated: found.rotated });
    const numFree = freeRects.length;
    for(let i=0;i<numFree;i++){
      const splits = splitFreeNode(freeRects[i], node);
      if(splits){ freeRects.splice(i,1); i--; freeRects.push(...splits); }
    }
    pruneFreeList();
  });

  return { placed, unplaced };
}

function estimateMaxUnitsCount(partL, partW, sheetL, sheetW, gap){
  const area = (partL+gap)*(partW+gap);
  if(area<=0 || partL<=0 || partW<=0) return 0;
  return Math.min(3000, Math.ceil((sheetL*sheetW)/area) + 4);
}

function calcMaxPourPiece(p){
  const sheetL = nestSheet.longueur, sheetW = nestSheet.largeur, gap = nestGap;
  const n = estimateMaxUnitsCount(p.longueur, p.largeur, sheetL, sheetW, gap);
  if(n<=0) return 0;
  const units = Array.from({length:n}, ()=>({nom:p.nom, w:p.longueur, h:p.largeur}));
  const result = packMaxRects(sheetL, sheetW, units, gap);
  return result.placed.length;
}

function nestCompute(){
  const sheetL = nestSheet.longueur, sheetW = nestSheet.largeur, gap = nestGap;
  let remaining = [];
  nestParts.forEach(p=>{
    for(let i=0;i<p.qte;i++) remaining.push({ nom:p.nom, w:p.longueur, h:p.largeur });
  });
  const totalDemande = remaining.length;

  // Plusieurs stratégies de tri par tôle ; on garde la meilleure imbrication obtenue.
  const strategies = [
    (a,b)=> (b.w*b.h) - (a.w*a.h),                 // surface décroissante
    (a,b)=> Math.max(b.w,b.h) - Math.max(a.w,a.h), // plus grand côté décroissant
    (a,b)=> Math.min(b.w,b.h) - Math.min(a.w,a.h), // plus petit côté décroissant
    (a,b)=> (b.w+b.h) - (a.w+a.h),                 // périmètre décroissant
  ];
  const packBest = (units)=>{
    let best = null;
    strategies.forEach(cmp=>{
      const result = packMaxRects(sheetL, sheetW, units.slice().sort(cmp), gap);
      const surfaceUtile = result.placed.reduce((sum,q)=>sum+q.w*q.h,0);
      const score = surfaceUtile*1000 + result.placed.length; // priorité : surface utilisée (moins de tôles), puis nb de pièces
      if(!best || score > best.score){ best = { ...result, score }; }
    });
    return best;
  };

  // Tant qu'il reste des pièces, on ouvre une nouvelle tôle (même format).
  const sheets = [];
  const surfaceFeuille = sheetL * sheetW;
  while(remaining.length && sheets.length < 50){
    const best = packBest(remaining);
    if(!best.placed.length) break; // le reste ne rentre sur aucune tôle de ce format
    const surfaceUtile = best.placed.reduce((sum,q)=>sum+q.w*q.h,0);
    sheets.push({ placed: best.placed, taux: surfaceFeuille>0 ? Math.round(surfaceUtile/surfaceFeuille*1000)/10 : 0, surfaceUtile });
    remaining = best.unplaced;
  }
  const surfaceTotale = sheets.reduce((sum,sh)=>sum+sh.surfaceUtile,0);
  const placedCount = sheets.reduce((sum,sh)=>sum+sh.placed.length,0);
  const tauxGlobal = sheets.length && surfaceFeuille>0 ? Math.round(surfaceTotale/(surfaceFeuille*sheets.length)*1000)/10 : 0;
  return { sheets, unplaced: remaining, totalDemande, placedCount, tauxGlobal };
}

    if(files.length>1 && added) toast(`${added} pièce${added>1?'s':''} ajoutée${added>1?'s':''}`);
    e.target.value = ''; // permet de recharger le même fichier après l'avoir retiré
    renderImbrication();
  };

  document.getElementById('nest-add-manual').onclick = ()=>{
    nestParts.push({ id: uid(), nom: 'Pièce', longueur: 300, largeur: 200, qte: 1, source: 'manuel' });
    renderImbrication();
  };

  const nestClear = document.getElementById('nest-clear');
  if(nestClear) nestClear.onclick = async ()=>{
    if(await askConfirm(`Retirer les ${nestParts.length} pièces de l'imbrication ?`)){ nestParts = []; renderImbrication(); }
  };
  view.querySelectorAll('[data-nest-remove]').forEach(btn=>{
    btn.onclick = ()=>{ nestParts = nestParts.filter(p=>p.id!==btn.dataset.nestRemove); renderImbrication(); };
  });
  view.querySelectorAll('[data-nest-usemax]').forEach(btn=>{
    btn.onclick = ()=>{
      const p = nestParts.find(x=>x.id===btn.dataset.nestUsemax);
      if(p){ p.qte = Math.max(1, parseInt(btn.dataset.nestMax)||1); renderImbrication(); }
    };
  });
  view.querySelectorAll('[data-nest-field]').forEach(inp=>{
    inp.onchange = ()=>{
      const p = nestParts.find(x=>x.id===inp.dataset.nestId);
      if(!p) return;
      const f = inp.dataset.nestField;
      p[f] = (f==='nom') ? inp.value : (parseInt(inp.value)||0);
      renderImbrication();
    };
  });

  document.getElementById('nest-calc').onclick = ()=>{
    const result = nestCompute();
    renderNestResult(result);
  };
}

      </div>

/* ---------------------------------------------------------
   CINTRAGE — lecture d'un tube cintré au format STEP
   Principe : dans un tube cintré, les tronçons droits sont des CYLINDRICAL_SURFACE et les
   cintres des TOROIDAL_SURFACE (rayon majeur = rayon de cintrage sur fibre neutre, rayon
   mineur = rayon du tube). On reconstitue la ligne moyenne : les points d'intersection sont
   les sommets (et les deux extrémités) de la ligne brisée théorique, puis on calcule la LRA
   (longueur rectiligne développée = droites + arcs).
--------------------------------------------------------- */
let cintrage = { fileName:'', raw:null, base:null, sel:0, inverse:false, adjStart:0, adjEnd:0, error:'', wire:null, rayonImpose:null, view:{ yaw:-0.7, pitch:0.45, zoom:1 } };

const v3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,k)=>[a[0]*k,a[1]*k,a[2]*k],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  unit:a=>{ const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l,a[1]/l,a[2]/l]; }
};

function stepParseEntities(text){
  const body = text.replace(/\/\*[\s\S]*?\*\//g,'');
  const ents = {};
  const re = /#(\d+)\s*=\s*([A-Z0-9_]+)\s*\(([\s\S]*?)\)\s*;/g;
  let m;
  while((m = re.exec(body))) ents[m[1]] = { type:m[2], args:m[3] };
  return ents;
}

function parseStepTube(text){
  const E = stepParseEntities(text);
  const clean = s => s.replace(/'[^']*'/g,'');
  const refs = s => (clean(s).match(/#\d+/g)||[]).map(x=>x.slice(1));
  const nums = s => (clean(s).replace(/#\d+/g,'').match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[]).map(parseFloat);
  const point = id => { const e = E[id]; if(!e) return null; const n = nums(e.args); return n.length>=3 ? n.slice(0,3) : null; };
  const place = id => {
    const e = E[id]; if(!e || e.type!=='AXIS2_PLACEMENT_3D') return null;
    const r = refs(e.args); const loc = point(r[0]); const z = r[1] ? point(r[1]) : null;
    return (loc && z) ? { loc, z: v3.unit(z) } : null;
  };

  const cyl = [], tor = [], verts = [];
  Object.values(E).forEach(e=>{
    if(e.type==='CYLINDRICAL_SURFACE'){
      const pl = place(refs(e.args)[0]), n = nums(e.args);
      if(pl && n.length) cyl.push({ P:pl.loc, d:pl.z, r:n[n.length-1] });
    }else if(e.type==='TOROIDAL_SURFACE'){
      const pl = place(refs(e.args)[0]), n = nums(e.args);
      if(pl && n.length>=2) tor.push({ C:pl.loc, N:pl.z, R:n[0], r:n[1] });
    }else if(e.type==='VERTEX_POINT'){
      const p = point(refs(e.args)[0]); if(p) verts.push(p);
    }
  });
  if(!cyl.length && !tor.length) throw new Error("Aucune surface cylindrique ou torique trouvée : ce STEP ne semble pas être un tube cintré en volume/surface.");

  const distToLine = (p,P,d)=>{ const w = v3.sub(p,P); return v3.len(v3.sub(w, v3.mul(d, v3.dot(w,d)))); };

  const rOut = tor.length ? Math.max(...tor.map(t=>t.r)) : Math.max(...cyl.map(c=>c.r));
  const sameR = (a,b,tol)=> Math.abs(a-b) <= (tol||0.02);

  // Droites (axes des tronçons) à rayon extérieur, sans doublon
  const lines = [];
  cyl.filter(c=>sameR(c.r, rOut)).forEach(c=>{
    if(!lines.some(l=>Math.abs(v3.dot(l.d,c.d))>0.9999 && distToLine(c.P,l.P,l.d)<0.05)) lines.push({ P:c.P, d:c.d });
  });
  // Rayon intérieur éventuel (tube creux) : cylindre coaxial plus petit
  let rIn = null;
  cyl.filter(c=>c.r < rOut-0.02).forEach(c=>{
    if(lines.some(l=>Math.abs(v3.dot(l.d,c.d))>0.9999 && distToLine(c.P,l.P,l.d)<0.05)) rIn = Math.max(rIn||0, c.r);
  });

  // Cintres (tores à rayon mineur = rayon extérieur), sans doublon
  const bendsRaw = [];
  tor.filter(t=>sameR(t.r, rOut)).forEach(t=>{
    if(!bendsRaw.some(b=>v3.len(v3.sub(b.C,t.C))<0.05 && sameR(b.R,t.R,0.01) && Math.abs(v3.dot(b.N,t.N))>0.9999)) bendsRaw.push(t);
  });

  // Extrémités et orientation : sommets situés sur le cylindre d'une droite donnée
  const vertsOnLine = l => verts.filter(p=> Math.abs(distToLine(p,l.P,l.d) - rOut) < 0.05 + 0.002*rOut);

  let ordered, points, radii;
  if(!bendsRaw.length){
    if(lines.length!==1) throw new Error('Tube droit attendu avec un seul axe, ' + lines.length + ' trouvés.');
    const vs = vertsOnLine(lines[0]);
    if(vs.length<2) throw new Error("Extrémités du tube introuvables (sommets manquants).");
    const ts = vs.map(p=>v3.dot(v3.sub(p,lines[0].P), lines[0].d));
    const a = v3.add(lines[0].P, v3.mul(lines[0].d, Math.min(...ts)));
    const b = v3.add(lines[0].P, v3.mul(lines[0].d, Math.max(...ts)));
    points = [a,b]; radii = [];
  }else{
    // Graphe : droites = nœuds, cintres = arêtes (une droite est tangente à un tore si elle est dans son plan à distance R du centre)
    const adj = lines.map(()=>[]);
    bendsRaw.forEach((t,ti)=>{
      const hit = [];
      lines.forEach((l,li)=>{
        if(Math.abs(v3.dot(l.d,t.N))>1e-3) return;
        if(Math.abs(v3.dot(v3.sub(l.P,t.C),t.N))>0.05+0.001*t.R) return;
        if(Math.abs(distToLine(t.C,l.P,l.d)-t.R) > 0.02*t.R+0.05) return;
        hit.push(li);
      });
      if(hit.length!==2) throw new Error(`Cintre ${ti+1} : ${hit.length} tronçon(s) droit(s) rattaché(s) au lieu de 2 (cintres jointifs sans partie droite, ou modélisation non standard).`);
      adj[hit[0]].push({ to:hit[1], bend:ti }); adj[hit[1]].push({ to:hit[0], bend:ti });
    });
    const ends = adj.map((a,i)=>a.length===1?i:-1).filter(i=>i>=0);
    if(ends.length!==2 || adj.some(a=>a.length>2)) throw new Error("La ligne moyenne n'est pas un chemin simple (boucle ou branches) : tube non reconnu.");
    const order = [ends[0]], bendOrder = [];
    let prev = -1, cur = ends[0];
    while(true){
      const nxt = adj[cur].find(e=>e.to!==prev);
      if(!nxt) break;
      bendOrder.push(nxt.bend); order.push(nxt.to); prev = cur; cur = nxt.to;
      if(order.length>lines.length+1) throw new Error('Parcours du tube impossible.');
    }
    if(order.length!==lines.length) throw new Error('Tous les tronçons droits ne sont pas reliés entre eux.');
    // Intersections des axes successifs
    const inter = [];
    for(let k=0;k<order.length-1;k++){
      const A = lines[order[k]], B = lines[order[k+1]];
      const b = v3.dot(A.d,B.d), w0 = v3.sub(A.P,B.P), d = v3.dot(A.d,w0), e = v3.dot(B.d,w0);
      const den = 1-b*b;
      if(Math.abs(den)<1e-9) throw new Error('Cintre à 180° (axes parallèles) : point d\'intersection non défini.');
      const t = (b*e-d)/den, s = (e-b*d)/den;
      inter.push(v3.mul(v3.add(v3.add(A.P,v3.mul(A.d,t)), v3.add(B.P,v3.mul(B.d,s))), 0.5));
    }
    // Extrémités : sommet le plus éloigné de l'intersection voisine le long de l'axe
    const endPoint = (li, I)=>{
      const l = lines[li], vs = vertsOnLine(l);
      if(!vs.length) throw new Error('Extrémité du tube introuvable (sommets manquants).');
      const cen = vs.reduce((a,p)=>v3.add(a,p),[0,0,0]).map(x=>x/vs.length);
      const away = Math.sign(v3.dot(v3.sub(cen,I), l.d)) || 1; // sens de l.d qui s'éloigne de I
      const tmax = Math.max(...vs.map(p=>away*v3.dot(v3.sub(p,I), l.d)));
      return v3.add(I, v3.mul(l.d, away*tmax));
    };
    const start = endPoint(order[0], inter[0]);
    const end = endPoint(order[order.length-1], inter[inter.length-1]);
    points = [start, ...inter, end];
    radii = bendOrder.map(bi=>bendsRaw[bi].R);
  }
  return { points, radii, OD: 2*rOut, ID: rIn!=null ? 2*rIn : null };
}

/* ---- CINTRAGE : tube modélisé en surfaces B-spline (ex. tuyaux CATIA / assemblages) ----
   Pas de cylindres ni de tores : on échantillonne les surfaces du solide « tube », puis on reconstruit la ligne
   moyenne par coupes successives (cercle ajusté dans chaque section), on détecte les cintres par la courbure,
   on ajuste une droite sur chaque tronçon et les points d'intersection sont les intersections des droites. */
function stepStatements(text){
  const body = text.replace(/\/\*[\s\S]*?\*\//g,'');
  const S = new Map();
  const re = /#(\d+)\s*=\s*([\s\S]*?);\s*(?=#\d+\s*=|ENDSEC)/g;
  let m;
  while((m = re.exec(body))) S.set(m[1], m[2]);
  return S;
}
function stBalanced(s, start){
  let d = 0;
  for(let i=start;i<s.length;i++){
    const c = s[i];
    if(c==='(') d++;
    else if(c===')'){ d--; if(d===0) return i; }
  }
  return s.length-1;
}
function stNums(s){ return (s.match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[]).map(parseFloat); }
function stRefs(s){ return (s.replace(/'[^']*'/g,'').match(/#\d+/g)||[]).map(x=>x.slice(1)); }
function stCleanName(s){ return (s||'').replace(/\\X2\\([0-9A-F]+)\\X0\\/g,(m,h)=>{ let o=''; for(let i=0;i<h.length;i+=4) o+=String.fromCharCode(parseInt(h.substr(i,4),16)); return o; }); }

function stSplineSurface(S, id){
  const raw = S.get(id); if(!raw) return null;
  const pt = pid => { const r = S.get(pid); if(!r) return null; const k = r.lastIndexOf('('); const n = stNums(r.slice(k)); return n.length>=3 ? n.slice(0,3) : null; };
  let p,q,grid,um,vm,uk,vk,W=null;
  const isComplex = raw.trim().startsWith('(');
  if(isComplex){
    if(raw.indexOf('B_SPLINE_SURFACE_WITH_KNOTS')<0) return null;
    const a = raw.indexOf('B_SPLINE_SURFACE(');
    const head = raw.slice(a+17).match(/^\s*(\d+)\s*,\s*(\d+)\s*,/); if(!head) return null;
    p = +head[1]; q = +head[2];
    const g0 = raw.indexOf('((', a+17); grid = raw.slice(g0, stBalanced(raw,g0)+1);
    const kk = raw.indexOf('B_SPLINE_SURFACE_WITH_KNOTS(');
    const k0 = raw.indexOf('(', kk); const kb = raw.slice(k0, stBalanced(raw,k0)+1);
    const gr = kb.slice(1,-1).match(/\(([^()]*)\)/g)||[]; if(gr.length<4) return null;
    [um,vm,uk,vk] = gr.slice(0,4).map(stNums);
    const wi = raw.indexOf('RATIONAL_B_SPLINE_SURFACE(');
    if(wi>=0){ const w0 = raw.indexOf('((', wi); const wg = raw.slice(w0, stBalanced(raw,w0)+1); W = (wg.match(/\(([^()]*)\)/g)||[]).map(stNums); }
  }else{
    if(!/^B_SPLINE_SURFACE_WITH_KNOTS/.test(raw.trim())) return null;
    const a = raw.indexOf('(');
    const head = raw.slice(a+1).match(/^\s*'[^']*'\s*,\s*(\d+)\s*,\s*(\d+)\s*,/); if(!head) return null;
    p = +head[1]; q = +head[2];
    const g0 = raw.indexOf('((', a); const g1 = stBalanced(raw,g0); grid = raw.slice(g0,g1+1);
    const rest = raw.slice(g1+1); const gr = rest.match(/\(([^()]*)\)/g)||[]; if(gr.length<4) return null;
    [um,vm,uk,vk] = gr.slice(0,4).map(stNums);
  }
  const rows = (grid.slice(1,-1).match(/\(([^()]*)\)/g)||[]).map(r=>stRefs(r).map(pt));
  if(!rows.length || rows.some(r=>r.some(x=>!x))) return null;
  const expand = (mm,kk)=>{ const o=[]; mm.forEach((m,i)=>{ for(let j=0;j<m;j++) o.push(kk[i]); }); return o; };
  return { p, q, cp: rows, W, U: expand(um,uk), V: expand(vm,vk) };
}
function stBasis(K, p, u){
  const n = K.length-p-2; // dernier indice de fonction
  let s;
  if(u>=K[n+1]) s = n; else if(u<=K[p]) s = p; else { let lo=p, hi=n+1; while(hi-lo>1){ const mid=(lo+hi)>>1; if(u>=K[mid]) lo=mid; else hi=mid; } s = lo; }
  const N = new Array(p+1).fill(0); N[0]=1; const L=[], R=[];
  for(let j=1;j<=p;j++){
    L[j] = u-K[s+1-j]; R[j] = K[s+j]-u; let saved = 0;
    for(let r=0;r<j;r++){ const den = R[r+1]+L[j-r]; const t = den ? N[r]/den : 0; N[r] = saved + R[r+1]*t; saved = L[j-r]*t; }
    N[j] = saved;
  }
  return { s, N };
}
function stSampleSurface(sf, step, out){
  const { p,q,cp,W,U,V } = sf;
  const nu = cp.length, nv = cp[0].length;
  // taille approximative du patch
  let lu=0, lv=0;
  for(let j=0;j<nv;j+=Math.max(1,nv-1)) for(let i=0;i<nu-1;i++) lu = Math.max(lu, Math.hypot(cp[i+1][j][0]-cp[i][j][0], cp[i+1][j][1]-cp[i][j][1], cp[i+1][j][2]-cp[i][j][2]));
  let totU=0, totV=0;
  for(let i=0;i<nu-1;i++) totU += Math.hypot(cp[i+1][0][0]-cp[i][0][0], cp[i+1][0][1]-cp[i][0][1], cp[i+1][0][2]-cp[i][0][2]);
  for(let j=0;j<nv-1;j++) totV += Math.hypot(cp[0][j+1][0]-cp[0][j][0], cp[0][j+1][1]-cp[0][j][1], cp[0][j+1][2]-cp[0][j][2]);
  const nU = Math.max(6, Math.min(120, Math.ceil(totU/step))), nV = Math.max(6, Math.min(120, Math.ceil(totV/step)));
  const u0=U[p], u1=U[U.length-p-1], v0=V[q], v1=V[V.length-q-1];
  const Bv = []; for(let b=0;b<=nV;b++) Bv.push(stBasis(V,q,v0+(v1-v0)*b/nV));
  for(let a=0;a<=nU;a++){
    const bu = stBasis(U,p,u0+(u1-u0)*a/nU);
    for(let b=0;b<=nV;b++){
      const bv = Bv[b]; let x=0,y=0,z=0,w=0;
      for(let i=0;i<=p;i++){ const ii = bu.s-p+i; if(ii<0||ii>=nu) continue;
        for(let j=0;j<=q;j++){ const jj = bv.s-q+j; if(jj<0||jj>=nv) continue;
          const wt = (W ? W[ii][jj] : 1) * bu.N[i]*bv.N[j]; const c = cp[ii][jj];
          x += wt*c[0]; y += wt*c[1]; z += wt*c[2]; w += wt; } }
      if(w) out.push(x/w, y/w, z/w);
    }
  }
}
function stFindTubeSolids(S){
  // solides dont toutes les faces sont des surfaces B-spline ; le tube porte en général « tube » / « tuyau » dans son nom
  const prodNames = {};
  S.forEach((raw,id)=>{ if(/^PRODUCT\(/.test(raw)){ const m = raw.match(/^PRODUCT\('([^']*)'/); if(m) prodNames[id] = stCleanName(m[1]); } });
  const solids = [];
  S.forEach((raw,id)=>{
    if(!/^MANIFOLD_SOLID_BREP/.test(raw)) return;
    const nm = (raw.match(/^MANIFOLD_SOLID_BREP\('([^']*)'/)||[])[1] || '';
    const shell = S.get(stRefs(raw)[0]); if(!shell) return;
    const faces = stRefs(shell);
    let nb=0, nOther=0;
    faces.forEach(f=>{
      const fr = S.get(f); if(!fr) return;
      const sr = stRefs(fr); const surf = S.get(sr[sr.length-1]) || '';
      if(/B_SPLINE_SURFACE/.test(surf)) nb++; else nOther++;
    });
    solids.push({ id, name: stCleanName(nm), faces, nb, nOther });
  });
  // associe le nom du produit si le solide n'est pas nommé : l'ordre des PRODUCT suit celui des solides dans ces exports
  const pn = Object.keys(prodNames).map(k=>prodNames[k]);
  return { solids, pn };
}

function parseStepTubeSplineAll(text){
  const S = stepStatements(text);
  const { solids } = stFindTubeSolids(S);
  const cand = solids.filter(s=>s.nb>=4);
  if(!cand.length) throw new Error('Aucun solide en surfaces B-spline trouvé.');

function chainSplineTubes(list){
  list = list.map(r=>({ ...r, points:r.points.slice(), radii:r.radii.slice() }));
  const rev = r=>({ ...r, points:r.points.slice().reverse(), radii:r.radii.slice().reverse() });
  let again = true;
  while(again){
    again = false;
    for(let i=0;i<list.length && !again;i++) for(let j=i+1;j<list.length && !again;j++){
      for(const ea of [0,1]) for(const eb of [0,1]){
        if(again) break;

        const B = eb===1 ? rev(list[j]) : list[j];   // extrémité de jonction = premier point

        out.push(v3.add(C, v3.add(v3.mul(mv,-b.R*Math.cos(f)), v3.mul(din,b.R*Math.sin(f)))));
      }
    }
    out.push(B);
  });
  out.push(P[P.length-1]);
  return out;
}

function cintrageViewerSvg(){
  const W = 760, H = 470, v = cintrage.view;
  const m = cintrage.raw ? cintrageMetrics(cintrage.raw, cintrage.rayonImpose) : null;
  const center3 = m ? cintrageCenterline(m) : [];
  const wire = cintrage.wire || [];
  const all = center3.slice(); wire.forEach(l=>l.forEach(p=>all.push(p)));
  if(!all.length) return '';
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  all.forEach(p=>{ for(let a=0;a<3;a++){ if(p[a]<mn[a])mn[a]=p[a]; if(p[a]>mx[a])mx[a]=p[a]; } });
  const c = [0,1,2].map(a=>(mn[a]+mx[a])/2);
  const rad = Math.max(1, ...all.map(p=>v3.len(v3.sub(p,c))));
  const scale = Math.min(W,H)/2*0.88/rad*v.zoom;
  const cy=Math.cos(v.yaw), sy=Math.sin(v.yaw), cp=Math.cos(v.pitch), sp=Math.sin(v.pitch);
  const proj = p=>{
    const x=p[0]-c[0], y=p[1]-c[1], z=p[2]-c[2];
    const x1=cy*x-sy*y, y1=sy*x+cy*y, y2=cp*y1-sp*z, z2=sp*y1+cp*z;
    return [W/2 + x1*scale, H/2 - z2*scale];
  };
  const pt = p=>{ const q=proj(p); return q[0].toFixed(1)+','+q[1].toFixed(1); };
  const wireD = wire.map(l=>'M'+l.map(pt).join('L')).join('');
  let svg = `<svg id="cint-svg" width="100%" viewBox="0 0 ${W} ${H}" style="background:#fff;display:block;touch-action:none;cursor:grab;" xmlns="http://www.w3.org/2000/svg">`;
  if(wireD) svg += `<path d="${wireD}" fill="none" stroke="#9aa3ab" stroke-width="0.7"/>`;
  if(m){
    const od = Math.max(2, cintrage.raw.OD*scale);
    svg += `<polyline points="${center3.map(pt).join(' ')}" fill="none" stroke="rgba(91,147,179,0.28)" stroke-width="${od.toFixed(1)}" stroke-linejoin="round"/>`;
    svg += `<polyline points="${center3.map(pt).join(' ')}" fill="none" stroke="#1f5f8b" stroke-width="1.6" stroke-linejoin="round"/>`;
    m.points.forEach((p,i)=>{
      const q = proj(p);
      const lab = i===0 ? 'Départ' : (i===m.points.length-1 ? 'Fin' : 'P'+i);
      svg += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5" fill="#c0392b" stroke="#fff" stroke-width="1"/><text x="${(q[0]+7).toFixed(1)}" y="${(q[1]-7).toFixed(1)}" font-size="12" font-weight="600" fill="#c0392b">${lab}</text>`;
    });
  }
  return svg + '</svg>';
}

function cintrageAttachViewer(){
  const box = document.getElementById('cint-viewer');
  if(!box) return;
  const redraw = ()=>{ const w = document.getElementById('cint-svg-wrap'); if(w) w.innerHTML = cintrageViewerSvg(); };
  let drag = null;
  box.onpointerdown = e=>{ if(e.target.closest('button')) return; drag = { x:e.clientX, y:e.clientY, yaw:cintrage.view.yaw, pitch:cintrage.view.pitch }; box.setPointerCapture(e.pointerId); };
  box.onpointermove = e=>{
    if(!drag) return;
    cintrage.view.yaw = drag.yaw + (e.clientX-drag.x)*0.01;
    cintrage.view.pitch = Math.max(-1.5, Math.min(1.5, drag.pitch + (e.clientY-drag.y)*0.01));
    redraw();
  };
  box.onpointerup = box.onpointercancel = ()=>{ drag = null; };
  box.onwheel = e=>{ e.preventDefault(); cintrage.view.zoom = Math.max(0.3, Math.min(8, cintrage.view.zoom*(e.deltaY<0?1.12:0.89))); redraw(); };
  const set = (yaw,pitch)=>()=>{ cintrage.view = { yaw, pitch, zoom:1 }; redraw(); };
  box.querySelector('[data-v-iso]').onclick = set(-0.7,0.45);
  box.querySelector('[data-v-face]').onclick = set(0,0);
  box.querySelector('[data-v-dessus]').onclick = set(0,1.5707);
  box.querySelector('[data-v-cote]').onclick = set(-1.5707,0);
}

/* =========================================================
   TÔLERIE AÉRONAUTIQUE — relecture d'une gamme Clipper (PDF) et simulation par quantité
   Modèle : par opération, T.P. = temps de préparation (une fois par lot), T.F. = temps de fabrication (par pièce),
   taux horaire en €/h. Achats / sous-traitance = prix par pièce. Coût d'un lot de Q pièces :
   Σ(TP × taux) + Q × [ Σ(TF × taux) + Σ achats ]  (puis marge éventuelle).
   ========================================================= */
const AERO_KEY = 'tolerie-aero-gamme-v1';
let aero = aeroLoad();
function aeroBlank(){ return { head:{ piece:'', designation:'', client:'', plan:'', indicePlan:'', gammeMere:'', source:'' }, ops:[], achats:[], qtys:[1,5,10,25,50,100], marge:0, clipperTotal:null, status:'' }; }
function aeroLoad(){ try{ const o = JSON.parse(localStorage.getItem(AERO_KEY)||'null'); if(o && o.ops) return Object.assign(aeroBlank(), o); }catch(e){} return aeroBlank(); }
function aeroSave(){ try{ localStorage.setItem(AERO_KEY, JSON.stringify(aero)); }catch(e){} }
let aeroUid = 1000; const aeroId = ()=> 'o'+(++aeroUid)+Math.random().toString(36).slice(2,5);
const AERO_CODES = ['IDMAT','DEBIT','CTADM','CTRL','AJUTA','CHAUD','LASER','PLIAG','SOUD','FORM','STUSI','STSOU','STPRO','USIN','MONT','EMBAL'];

/* ---- lecture du PDF Clipper : lignes de texte regroupées par position verticale ---- */
async function aeroPdfLines(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  const lines = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p); const tc = await page.getTextContent();
    const items = tc.items.filter(it=>it.str && it.str.trim()).map(it=>({ x:it.transform[4], y:it.transform[5], s:it.str.trim() }));
    items.sort((a,b)=> b.y-a.y || a.x-b.x);
    let cur = null;
    items.forEach(it=>{ if(cur && Math.abs(cur.y-it.y)<=2.5){ cur.items.push(it); } else { cur = { page:p, y:it.y, items:[it] }; lines.push(cur); } });
  }
  lines.forEach(l=>{ l.items.sort((a,b)=>a.x-b.x); l.text = l.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim(); l.gy = l.page*3000 - l.y; });
  return lines;
}
function aeroMin(t){ const m = /^(\d+):(\d\d):(\d\d)$/.exec(t); return m ? (+m[1])*60 + (+m[2]) + (+m[3])/60 : 0; }
const aeroNum = s=> parseFloat(String(s).replace(',','.'));
function aeroParse(lines){
  const out = aeroBlank(); const all = lines.map(l=>l.text).join('\n'); let m;
  if((m = /N°\s*Plan\s*:\s*(\S+)/i.exec(all))) out.head.plan = m[1];
  if((m = /PIECE MERE\s*:\s*(\S+)/i.exec(all))) out.head.gammeMere = m[1];
  if((m = /Indice plan\s*:\s*(\S*)/i.exec(all)) && !/^Indice/i.test(m[1])) out.head.indicePlan = m[1];
  const cl = lines.find(l=>/\bCLIENT\b/.test(l.text));
  if(cl){ const t = cl.text.replace(/^.*?\bCLIENT\b\s*/,''); const mm = /^(\S+)\s+(.*)$/.exec(t); if(mm){ out.head.client = mm[1]; out.head.designation = mm[2]; } }
  const cf = /Coefficient\s*:\s*\d+\s+(\S+)/.exec(all); if(cf) out.head.piece = cf[1]; else out.head.piece = out.head.plan;
  // --- phases ---
  const hi = lines.findIndex(l=>/\bPhase\b/.test(l.text) && /Op[ée\?]rations/i.test(l.text));
  const ti = lines.findIndex((l,i)=>i>hi && /^TOTAL\b(?!\s*PRIX)/.test(l.text));
  if(hi>=0){
    const end = ti>=0 ? ti : lines.length;
    const rows = [], labels = [];
    const SKIP = /GAMME DE PIECES|Rang\s*:|Page\s*\d|^Prix\b|^T\.\s?[PF]\.?$|Phase\s+Op|^C\.\s?F/i;
    for(let i=hi+1;i<end;i++){
      const l = lines[i]; if(SKIP.test(l.text)) continue;
      const tk = l.text.split(' ');
      if(/^\d{1,4}$/.test(tk[0]) && l.items[0].x < 120){
        let rest = tk.slice(1); const prices = []; const times = [];
        while(rest.length && /^\d+[.,]\d+$/.test(rest[rest.length-1])) prices.unshift(rest.pop());
        while(rest.length && /^\d+:\d\d:\d\d$/.test(rest[rest.length-1])) times.unshift(rest.pop());
        const code = rest.length && /^[A-Z]{3,6}$/.test(rest[rest.length-1]) ? rest.pop() : '';
        if(code){ rows.push({ phase:+tk[0], code, label:rest.join(' '), times, prices, gy:l.gy, extra:[] }); continue; }
      }
      labels.push(l);
    }
    labels.forEach(l=>{ let best=null,d=1e9; rows.forEach(r=>{ const dd = Math.abs(r.gy-l.gy); if(dd<d){ d=dd; best=r; } }); if(best) best.extra.push(l); });
    rows.forEach(r=>{
      const parts = r.extra.concat([{ gy:r.gy, text:r.label }]).filter(x=>x.text).sort((a,b)=>a.gy-b.gy).map(x=>x.text);
      const tp = r.times.length===2 ? aeroMin(r.times[0]) : 0, tf = r.times.length===2 ? aeroMin(r.times[1]) : 0;
      const pTP = r.times.length===2 ? aeroNum(r.prices[0]||0) : 0, pTF = aeroNum(r.prices[r.prices.length-1]||0);
      if(r.code==='NOMEN' || r.code==='COMM') return;
      let taux = 0; if(tp>0 && pTP>0) taux = pTP/(tp/60); else if(tf>0 && pTF>0) taux = pTF/(tf/60);
      out.ops.push({ id:aeroId(), phase:r.phase, label:parts.join(' · '), code:r.code, tp:Math.round(tp*100)/100, tf:Math.round(tf*100)/100, taux:Math.round(taux*100)/100 });
    });
    if(ti>=0){
      const tt = lines[ti].text.match(/\d+:\d\d:\d\d|\d+[.,]\d+/g)||[]; const tp2 = lines.slice(ti,ti+3).find(l=>/TOTAL PRIX/.test(l.text));
      out.clipperTotal = { tp: tt[0]?aeroMin(tt[0]):null, tf: tt[1]?aeroMin(tt[1]):null, prixTP: tt[2]?aeroNum(tt[2]):null, prixTF: tt[3]?aeroNum(tt[3]):null, prix: tp2 ? aeroNum((tp2.text.match(/\d+[.,]\d+/g)||[]).pop()) : null };
    }
  }
  // --- nomenclature : lignes d'achat / sous-traitance ---
  lines.forEach(l=>{
    const r = /^(\d{1,4})\s+(\S+)\s+([A-Z0-9]{3,8})\s+(?:(\d+)\s*\(u\)\s+)?(?:(\d+)\s*J\s+)?([A-Z0-9]{3,6})\s+([\d.,]+)\s*\/\s*u\s+([\d.,]+)$/.exec(l.text);
    if(r) out.achats.push({ id:aeroId(), label:r[2]+' ('+r[3]+')', fourn:r[6], prix:aeroNum(r[8]), prixArt:aeroNum(r[7]), note: aeroNum(r[8])===0 ? 'prix article '+r[7]+' €/u non retenu par Clipper (matière fournie ?)' : '' });
  });
  return out;
}
/* ---- calculs ---- */
function aeroOpCost(o){ return { tp:(o.tp||0)/60*(o.taux||0), tf:(o.tf||0)/60*(o.taux||0) }; }
function aeroSim(Q){
  let prepa=0, fab=0, tpMin=0, tfMin=0; aero.ops.forEach(o=>{ const c=aeroOpCost(o); prepa+=c.tp; fab+=c.tf; tpMin+=o.tp||0; tfMin+=o.tf||0; });
  const ach = aero.achats.reduce((s,a)=>s+(a.prix||0),0);
  const k = 1 + (aero.marge||0)/100;
  const lot = (prepa + Q*(fab+ach))*k;
  return { Q, prepa, fab, ach, lot, unit: lot/Q, hTotal:(tpMin+Q*tfMin)/60, minPiece:(tpMin/Q+tfMin) };
}
/* ---- export Excel ---- */
function aeroExport(){
  const nom = (aero.head.piece||'gamme').replace(/[^\w-]+/g,'_');

  }
  const wb = XLSX.utils.book_new(); const r2 = x=>Math.round(x*100)/100;
  const g = [['Phase','Désignation','Code','T.P. (min)','T.F. (min)','Taux (€/h)','Prix T.P. (€)','Prix T.F. (€/pièce)']];
  ops.forEach((o,i)=>{ const c=aeroOpCost(o); g.push([o.phase,o.label,o.code,o.tp,o.tf,o.taux,r2(c.tp),r2(c.tf)]); });
  const wsG = XLSX.utils.aoa_to_sheet(g); const n = ops.length+1;
  ops.forEach((o,i)=>{ const r=i+2; const c=aeroOpCost(o);
    wsG['G'+r] = { t:'n', f:`D${r}/60*F${r}`, v:r2(c.tp) }; wsG['H'+r] = { t:'n', f:`E${r}/60*F${r}`, v:r2(c.tf) }; });
  const tot = n+2; let sp=0,sf=0; ops.forEach(o=>{ const c=aeroOpCost(o); sp+=c.tp; sf+=c.tf; });
  XLSX.utils.sheet_add_aoa(wsG, [['','Total'],], { origin:'A'+tot });

  wsG['G'+tot] = { t:'n', f:`SUM(G2:G${n})`, v:r2(sp) }; wsG['H'+tot] = { t:'n', f:`SUM(H2:H${n})`, v:r2(sf) };
  wsG['!ref'] = `A1:H${tot}`; wsG['!cols'] = [7,48,9,11,11,11,14,18].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, wsG, 'Gamme');
  const a = [['Désignation','Fournisseur','Prix (€/pièce)','Remarque']]; aero.achats.forEach(x=>a.push([x.label,x.fourn,x.prix,x.note||'']));
  const wsA = XLSX.utils.aoa_to_sheet(a); const na = aero.achats.length+1;
  XLSX.utils.sheet_add_aoa(wsA, [['Total achats']], { origin:'A'+(na+2) });
  wsA['C'+(na+2)] = { t:'n', f:`SUM(C2:C${na})`, v:r2(aero.achats.reduce((s,x)=>s+(x.prix||0),0)) };
  wsA['!ref'] = `A1:D${na+2}`; wsA['!cols'] = [34,14,15,60].map(w=>({wch:w}));

  // simulation : une colonne par quantité, formules liées aux feuilles Gamme et Achats
  const col = i=>String.fromCharCode(66+i);
  const s = [['Quantité'].concat(qs), ['Préparation (lot)'], ['Fabrication (lot)'], ['Achats / sous-traitance (lot)'], ['Marge (%)'], ['Prix du lot (€)'], ['Prix unitaire (€)'], ['Temps total (h)']];
  const wsS = XLSX.utils.aoa_to_sheet(s);

    wsS[c+'5'] = { t:'n', v:aero.marge||0 }; f(6, `(${c}2+${c}3+${c}4)*(1+${c}5/100)`, sim.lot); f(7, `${c}6/${c}1`, sim.unit);
    wsS[c+'8'] = { t:'n', f:`(Gamme!D${tot}+${c}1*Gamme!E${tot})/60`, v:r2(sim.hTotal) }; });
